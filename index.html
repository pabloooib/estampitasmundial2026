<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PANINI | SOUVREIGN</title>
    <link rel="icon" type="image/jpg" href="panini.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --wc-cyan: #00e5ff;
            --gold: #ffd700;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', sans-serif; background: #050510; color: #fff; overflow-x: hidden; height: 100vh; }

        /* --- INTRO ANIMATION --- */
        #intro-space { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 10000; display: flex; 
            align-items: center; justify-content: center; overflow: hidden;
            pointer-events: none;
        }
        .earth-zoom { 
            width: 30vw; height: 30vw; min-width: 150px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png') center/cover; 
            animation: superZoom 4s forwards cubic-bezier(0.7, 0, 0.3, 1); 
        }
        @keyframes superZoom { 
            0% { transform: scale(0.1); opacity: 0; } 
            15% { opacity: 1; } 
            100% { transform: scale(40); opacity: 0; } 
        }

        /* --- LOGIN --- */
        .auth-container { 
            height: 100vh; width: 100%; display: none; 
            align-items: center; justify-content: center; 
            background: linear-gradient(rgba(5, 5, 16, 0.85), rgba(5, 5, 16, 0.85)), 
                        url('FIFA-World-Cup-2026.jpg') center/cover no-repeat;
            position: fixed; top: 0; left: 0; z-index: 5000; 
        }
        .auth-card { 
            background: rgba(10, 10, 26, 0.9); backdrop-filter: blur(25px); 
            padding: 50px 30px; border-radius: 40px; text-align: center; 
            width: 85%; max-width: 350px; border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        .auth-card h1 { font-family: 'Oswald'; letter-spacing: 6px; font-size: 2.8rem; margin-bottom: 5px; color: #fff; }
        
        .btn-login { 
            background: var(--wc-cyan); color: #000; border: none; padding: 18px; 
            border-radius: 20px; font-weight: 800; width: 100%; cursor: pointer; 
            margin-top: 30px; font-size: 1.1rem; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.3);
            transition: all 0.2s ease;
        }
        .btn-login:active { transform: scale(0.96); opacity: 0.8; }

        /* --- UI APP --- */
        .navbar { position: fixed; top: 0; width: 100%; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(5,5,16,0.9); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 1px solid var(--glass-border); }
        .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #0a0a1a; z-index: 1500; transition: 0.4s; padding: 30px 20px; border-right: 1px solid var(--glass-border); }
        .sidebar.active { left: 0; }
        .view { padding: 90px 15px 120px; max-width: 1000px; margin: auto; display: none; }
        .view.active { display: block; }

        /* --- STICKERS --- */
        .stk { aspect-ratio: 0.8; background: var(--glass); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px solid var(--glass-border); }
        .stk.selected { background: var(--wc-cyan); color: #000; box-shadow: 0 0 15px var(--wc-cyan); }

        /* --- ESPECIALES --- */
        .special-card { background: #111; border-radius: 20px; overflow: hidden; border: 1px solid var(--gold); margin-bottom: 15px; display: flex; align-items: center; cursor: pointer; }
        .special-card.selected { border: 2px solid var(--wc-cyan); box-shadow: 0 0 20px rgba(0,229,255,0.4); }
        .special-card img { width: 90px; height: 120px; object-fit: cover; }

        /* --- CART --- */
        .cart-trigger { position: fixed; bottom: 25px; right: 25px; background: var(--wc-cyan); color: #000; width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; z-index: 1001; box-shadow: 0 8px 25px rgba(0,229,255,0.5); }
        .cart-drawer { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: #fff; color: #000; z-index: 3000; transition: 0.4s; padding: 25px; display: flex; flex-direction: column; }
        .cart-drawer.active { right: 0; }
    </style>
</head>
<body>

    <div id="intro-space"><div class="earth-zoom"></div></div>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <p style="color: var(--wc-cyan); font-weight: 600; letter-spacing: 2px; margin-bottom: 5px;">SOUVREIGN</p>
            <h1>PANINI</h1>
            <p style="opacity: 0.5; font-size: 0.8rem;">COLECCIÓN OFICIAL 2026</p>
            <button class="btn-login" id="btn-login-action" onclick="loginWithGoogle()">
                INGRESAR AHORA
            </button>
            <p id="login-status" style="margin-top:15px; font-size:0.7rem; color:var(--wc-cyan); display:none;">Autenticando...</p>
        </div>
    </div>

    <div id="app" style="display:none;">
        <nav class="navbar">
            <div onclick="toggleSidebar()" style="font-size:1.5rem;"><i class="fa-solid fa-bars-staggered"></i></div>
            <span style="font-family:'Oswald'; letter-spacing:2px; font-size:1.2rem;">PANINI</span>
            <img id="nav-avatar" src="" style="width:38px; border-radius:50%; border:2px solid var(--wc-cyan);" onclick="showView('profile-view')">
        </nav>

        <div class="sidebar" id="sidebar">
            <div onclick="showView('album-view')" style="padding:15px; color:white;"><i class="fa-solid fa-book"></i> ÁLBUM</div>
            <div onclick="showView('prices-view')" style="padding:15px; color:white;"><i class="fa-solid fa-star"></i> ESPECIALES</div>
            <div onclick="showView('info-view')" style="padding:15px; color:white;"><i class="fa-solid fa-tags"></i> PRECIOS</div>
            <div onclick="showView('profile-view')" style="padding:15px; color:white;"><i class="fa-solid fa-user"></i> PERFIL</div>
            <div onclick="logout()" style="color:#ff5252; margin-top:30px; padding:15px;"><i class="fa-solid fa-power-off"></i> SALIR</div>
        </div>

        <div class="cart-trigger" onclick="toggleCart()">
            <i class="fa-solid fa-shopping-cart"></i>
            <span id="cart-badge" style="position:absolute; top:-5px; right:-5px; background:#ff5252; color:white; font-size:0.8rem; padding:3px 8px; border-radius:50%;">0</span>
        </div>

        <div class="cart-drawer" id="cart-drawer">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 style="font-family:'Oswald';">PEDIDO</h2>
                <i class="fa-solid fa-xmark" onclick="toggleCart()" style="font-size:1.5rem;"></i>
            </div>
            <div id="cart-list" style="flex:1; overflow-y:auto; margin:15px 0;"></div>
            <div style="border-top:2px solid #eee; padding-top:15px;">
                <div style="display:flex; justify-content:space-between; font-weight:bold; font-size:1.3rem; margin-bottom:15px;">
                    <span>TOTAL:</span> <span id="cart-total">Q0.00</span>
                </div>
                <button onclick="sendOrder()" style="width:100%; background:#25d366; color:#fff; border:none; padding:18px; border-radius:15px; font-weight:bold;">
                    PEDIR POR WHATSAPP
                </button>
            </div>
        </div>

        <div class="main-content">
            <div id="profile-view" class="view">
                <div style="text-align:center; background:var(--glass); padding:50px 20px; border-radius:30px; border:1px solid var(--glass-border);">
                    <img id="profile-img" src="" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--wc-cyan); margin-bottom:15px;">
                    <h2 id="profile-name" style="font-family:'Oswald';">---</h2>
                </div>
            </div>

            <div id="album-view" class="view active">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h2 id="group-title" style="font-family:'Oswald'; color:var(--wc-cyan); font-size:1.6rem;">GRUPO A</h2>
                    <div style="display:flex; gap:10px;">
                        <button onclick="changeGroup(-1)" style="background:var(--glass); border:none; color:white; width:40px; height:40px; border-radius:50%;"><</button>
                        <button onclick="changeGroup(1)" style="background:var(--glass); border:none; color:white; width:40px; height:40px; border-radius:50%;">></button>
                    </div>
                </div>
                <div id="country-scroll" style="display:flex; gap:12px; overflow-x:auto; padding-bottom:15px;"></div>
                <h3 id="country-label" style="margin:20px 0 10px; font-family:'Oswald'; opacity:0.5;">PAÍS</h3>
                <div id="sticker-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(75px, 1fr)); gap:12px;"></div>
            </div>

            <div id="prices-view" class="view">
                <h2 style="font-family:'Oswald'; text-align:center; margin-bottom:30px; color:var(--gold);">LEGENS & SPECIALS</h2>
                <div id="special-panini" class="special-card" onclick="toggleSpecial('CARTA PANINI', 45, 'special-panini')">
                    <img src="panini.jpg">
                    <div style="padding:20px;"><h3>CARTA PANINI</h3><b style="color:var(--wc-cyan);">Q45.00</b></div>
                </div>
                <div id="special-messi" class="special-card" onclick="toggleSpecial('MESSI LEYENDA', 30, 'special-messi')">
                    <img src="imagenmessi.jpg">
                    <div style="padding:20px;"><h3>MESSI LEYENDA</h3><b style="color:var(--wc-cyan);">Q30.00</b></div>
                </div>
                <div id="special-cr7" class="special-card" onclick="toggleSpecial('CR7 LEYENDA', 30, 'special-cr7')">
                    <img src="cristianomundial.jpg">
                    <div style="padding:20px;"><h3>CR7 LEYENDA</h3><b style="color:var(--wc-cyan);">Q30.00</b></div>
                </div>
            </div>

            <div id="info-view" class="view">
                <div style="background:var(--glass); padding:30px; border-radius:25px;">
                    <h2 style="font-family:'Oswald'; margin-bottom:20px;">PRECIOS</h2>
                    <p>Normal: Q2.00</p>
                    <p>Escudo: Q10.00</p>
                    <p>Especial: Q15.00</p>
                </div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Monitor de estado
    auth.onAuthStateChanged(user => {
        setTimeout(() => {
            const intro = document.getElementById('intro-space');
            if(intro) intro.style.display = 'none';
            
            if(user) {
                initApp(user);
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
            }
        }, 4000);
    });

    function loginWithGoogle() {
        const btn = document.getElementById('btn-login-action');
        const status = document.getElementById('login-status');
        btn.innerText = "ESPERE...";
        status.style.display = "block";
        
        const provider = new firebase.auth.GoogleAuthProvider();
        // Usamos signInWithRedirect para móviles para evitar que el popup se bloquee
        if(window.innerWidth < 768) {
            auth.signInWithRedirect(provider);
        } else {
            auth.signInWithPopup(provider).catch(err => {
                console.error(err);
                btn.innerText = "REINTENTAR";
                alert("Error al conectar. Intenta de nuevo.");
            });
        }
    }

    // El resto de la lógica permanece igual pero optimizada
    let cart = [];
    let currentGrp = 0;
    let selectedCountry = "";
    const grupos = [{id: "A", paises: ["México", "Sudáfrica", "Rep. Corea", "Rep. Checa"]},{id: "B", paises: ["Canadá", "Bosnia", "Qatar", "Suiza"]},{id: "C", paises: ["Brasil", "Marruecos", "Haití", "Escocia"]},{id: "D", paises: ["EE.UU.", "Paraguay", "Australia", "Turquía"]},{id: "E", paises: ["Alemania", "Curazao", "C. Marfil", "Ecuador"]},{id: "F", paises: ["Países Bajos", "Japón", "Túnez", "Albania"]},{id: "G", paises: ["Bélgica", "Egipto", "Irán", "N. Zelanda"]},{id: "H", paises: ["España", "Uruguay", "Arabia", "Cabo Verde"]},{id: "I", paises: ["Francia", "Senegal", "Noruega", "Irak"]},{id: "J", paises: ["Argentina", "Austria", "Argelia", "Jordania"]},{id: "K", paises: ["Portugal", "Colombia", "Uzbekistán", "Jamaica"]},{id: "L", paises: ["Inglaterra", "Croacia", "Ghana", "Panamá"]}];
    const flags = { "México":"mx", "Sudáfrica":"za", "Rep. Corea":"kr", "Rep. Checa":"cz", "Canadá":"ca", "Bosnia":"ba", "Qatar":"qa", "Suiza":"ch", "Brasil":"br", "Marruecos":"ma", "Haití":"ht", "Escocia":"gb-sct", "EE.UU.":"us", "Paraguay":"py", "Australia":"au", "Turquía":"tr", "Alemania":"de", "Curazao":"cw", "C. Marfil":"ci", "Ecuador":"ec", "Países Bajos":"nl", "Japón":"jp", "Túnez":"tn", "Albania":"al", "Bélgica":"be", "Egipto":"eg", "Irán":"ir", "N. Zelanda":"nz", "España":"es", "Uruguay":"uy", "Arabia":"sa", "Cabo Verde":"cv", "Francia":"fr", "Senegal":"sn", "Noruega":"no", "Irak":"iq", "Argentina":"ar", "Austria":"at", "Argelia":"dz", "Jordania":"jo", "Portugal":"pt", "Colombia":"co", "Uzbekistán":"uz", "Jamaica":"jm", "Inglaterra":"gb-eng", "Croacia":"hr", "Ghana":"gh", "Panamá":"pa" };

    function initApp(user) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('nav-avatar').src = user.photoURL;
        document.getElementById('profile-img').src = user.photoURL;
        document.getElementById('profile-name').innerText = user.displayName;
        selectedCountry = grupos[0].paises[0];
        renderGroup();
        renderStickers();
    }

    function renderGroup() {
        const g = grupos[currentGrp];
        document.getElementById('group-title').innerText = "GRUPO " + g.id;
        const scroll = document.getElementById('country-scroll');
        scroll.innerHTML = "";
        g.paises.forEach(p => {
            const card = document.createElement('div');
            const active = selectedCountry === p;
            card.style = `min-width:110px; padding:12px; border-radius:15px; background:${active?'var(--wc-cyan)':'var(--glass)'}; color:${active?'#000':'#fff'}; text-align:center; cursor:pointer; border:1px solid ${active?'#fff':'var(--glass-border)'}`;
            card.innerHTML = `<img src="https://flagcdn.com/w40/${flags[p]}.png" style="display:block; margin:0 auto 6px;"> <b style="font-size:0.8rem;">${p}</b>`;
            card.onclick = () => { selectedCountry = p; renderGroup(); renderStickers(); };
            scroll.appendChild(card);
        });
    }

    function renderStickers() {
        document.getElementById('country-label').innerText = selectedCountry.toUpperCase();
        const grid = document.getElementById('sticker-grid'); grid.innerHTML = "";
        for(let i=1; i<=20; i++){
            const id = `${selectedCountry} #${i}`;
            const price = (i === 1) ? 10 : (i === 13 ? 15 : 2);
            const isSel = cart.find(x => x.id === id);
            const s = document.createElement('div');
            s.className = `stk ${isSel ? 'selected' : ''}`;
            s.innerHTML = `<b>${i}</b><small>Q${price}</small>`;
            s.onclick = () => addToCart(id, price);
            grid.appendChild(s);
        }
        syncSpecialUI();
    }

    function addToCart(id, price) {
        const idx = cart.findIndex(x => x.id === id);
        if(idx > -1) cart.splice(idx, 1);
        else cart.push({id, price});
        updateCartUI();
        renderStickers();
    }

    function toggleSpecial(id, price, elementId) {
        const idx = cart.findIndex(x => x.id === id);
        if(idx > -1) cart.splice(idx, 1);
        else cart.push({id, price});
        updateCartUI();
        syncSpecialUI();
    }

    function syncSpecialUI() {
        const specials = [{name:'MESSI LEYENDA', el:'special-messi'},{name:'CR7 LEYENDA', el:'special-cr7'},{name:'CARTA PANINI', el:'special-panini'}];
        specials.forEach(s => {
            const el = document.getElementById(s.el);
            if(el) cart.find(x => x.id === s.name) ? el.classList.add('selected') : el.classList.remove('selected');
        });
    }

    function updateCartUI() {
        document.getElementById('cart-badge').innerText = cart.length;
        const list = document.getElementById('cart-list');
        list.innerHTML = "";
        let total = 0;
        cart.forEach((item, index) => {
            total += item.price;
            list.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #eee;">
                <div><b>${item.id}</b><br><small>Q${item.price}.00</small></div>
                <i class="fa-solid fa-trash" style="color:#ff5252;" onclick="removeItem(${index})"></i>
            </div>`;
        });
        document.getElementById('cart-total').innerText = `Q${total}.00`;
    }

    function removeItem(i) { cart.splice(i, 1); updateCartUI(); renderStickers(); }
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
    function toggleCart() { document.getElementById('cart-drawer').classList.toggle('active'); }
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('sidebar').classList.remove('active');
    }
    function changeGroup(d) { currentGrp = (currentGrp + d + grupos.length) % grupos.length; renderGroup(); renderStickers(); }
    function logout() { auth.signOut().then(() => location.reload()); }

    function sendOrder() {
        if(cart.length === 0) return alert("Vacío");
        const items = cart.map(x => `• ${x.id}`).join('%0A');
        const text = `*PEDIDO PANINI*%0A*Cliente:* ${auth.currentUser.displayName}%0A%0A${items}%0A%0A*TOTAL: ${document.getElementById('cart-total').innerText}*`;
        window.open(`https://wa.me/50246199644?text=${text}`, '_blank');
    }
</script>
</body>
</html>
