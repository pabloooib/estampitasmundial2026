<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANINI 2026 | ÁLBUM DIGITAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    
    <style>
        /* Paleta Oficial Mundial 2026 */
        :root { 
            --world-cup-green: #004d3d;
            --world-cup-blue: #001b3a;
            --world-cup-purple: #4a148c;
            --world-cup-yellow: #ffeb3b;
            --fifa-gold: #c6a15a;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: linear-gradient(135deg, var(--world-cup-blue) 0%, var(--world-cup-purple) 100%);
            color: white; 
            min-height: 100vh;
        }

        /* App Principal */
        header { 
            background: var(--world-cup-green); 
            padding: 1.5rem; 
            text-align: center; 
            border-bottom: 5px solid var(--world-cup-yellow); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); 
        }

        .container { 
            max-width: 1200px; 
            margin: 20px auto; 
            padding: 0 15px; 
            display: grid; 
            grid-template-columns: 300px 1fr 250px; 
            gap: 20px; 
        }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            color: #333; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); 
        }
        
        /* Sidebar Equipos */
        .sidebar { padding: 15px; }
        .group-tag { 
            background: var(--world-cup-purple); 
            color: white; 
            padding: 10px; 
            font-family: 'Oswald'; 
            text-align: center; 
            margin-bottom: 10px; 
            border-radius: 5px; 
        }
        .team-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 12px; 
            border-bottom: 1px solid #eee; 
            cursor: pointer; 
            transition: 0.2s; 
            font-family: 'Oswald'; 
        }
        .team-item:hover { 
            background: #f0f0f0; 
            color: var(--world-cup-purple); 
            padding-left: 15px;
        }

        /* Cuadrícula Estampas */
        .main-content { padding: 20px; }
        .sticker-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); 
            gap: 12px; 
            margin-top: 20px; 
        }
        .sticker { 
            aspect-ratio: 2/3; 
            background: #eee; 
            border: 2px dashed #ccc; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 900; 
            cursor: pointer; 
            color: #bbb; 
            transition: 0.3s; 
        }
        .sticker.owned { 
            background: linear-gradient(to bottom, #00c853, #007e33) !important; 
            color: white; 
            border: 2px solid white; 
            transform: rotate(-2deg) scale(1.05); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); 
        }

        /* Panel de Precios */
        .shop-panel { padding: 15px; }
        .price-item { 
            background: #f9f9f9; 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            border-left: 4px solid var(--world-cup-yellow); 
        }
        .price-title { font-size: 0.75rem; font-weight: bold; color: #666; text-transform: uppercase; }
        .price-value { font-family: 'Oswald'; font-size: 1.2rem; color: var(--world-cup-green); }

        @media (max-width: 900px) { 
            .container { grid-template-columns: 1fr; } 
        }
    </style>
</head>
<body>

    <header>
        <h1 style="font-family:'Oswald'; letter-spacing: 2px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">COLECCIÓN OFICIAL 2026</h1>
        <p style="color: var(--world-cup-yellow); font-family: 'Oswald'; font-size: 0.9rem; margin-top: 5px;">ÁLBUM DIGITAL - MODO VISTA PREVIA</p>
    </header>

    <div class="container">
        <div class="card sidebar">
            <div class="group-tag" id="grp-name">GRUPO A</div>
            <div id="team-list"></div>
            <div style="display:flex; justify-content:space-between; margin-top:15px;">
                <button onclick="changeGroup(-1)" style="padding:12px; background:var(--world-cup-purple); border:none; color:white; border-radius:5px; cursor:pointer; width:48%; font-family:'Oswald';">◀ ANTERIOR</button>
                <button onclick="changeGroup(1)" style="padding:12px; background:var(--world-cup-purple); border:none; color:white; border-radius:5px; cursor:pointer; width:48%; font-family:'Oswald';">SIGUIENTE ▶</button>
            </div>
        </div>

        <div class="card main-content">
            <h2 id="current-team-title" style="font-family:'Oswald'; color:var(--world-cup-blue); text-align:center; border-bottom: 2px solid var(--world-cup-yellow); padding-bottom: 10px;">SELECCIONA UN PAÍS</h2>
            <div class="sticker-grid" id="sticker-grid"></div>
        </div>

        <div class="card shop-panel">
            <h3 style="font-family:'Oswald'; margin-bottom:15px; border-bottom:2px solid var(--world-cup-purple); color: var(--world-cup-purple);">TIENDA PANINI</h3>
            <div class="price-item">
                <div class="price-title">Álbum Pasta Suave</div>
                <div class="price-value">Q 25.00</div>
            </div>
            <div class="price-item">
                <div class="price-title">Álbum Pasta Dura</div>
                <div class="price-value">Q 120.00</div>
            </div>
            <div class="price-item">
                <div class="price-title">Sobre (5 Estampas)</div>
                <div class="price-value">Q 7.00</div>
            </div>
            <div class="price-item">
                <div class="price-title">Caja (100 Sobres)</div>
                <div class="price-value">Q 650.00</div>
            </div>
            <p style="font-size:0.65rem; color:#888; margin-top:15px; text-align:center; font-style: italic;">*Precios oficiales sugeridos para Guatemala</p>
        </div>
    </div>

<script>
    const grupos = [
        {id: "A", paises: ["México", "Sudáfrica", "Corea del Sur", "República Checa"]},
        {id: "B", paises: ["Canadá", "Bosnia y Herzegovina", "Qatar", "Suiza"]},
        {id: "C", paises: ["Brasil", "Marruecos", "Haití", "Escocia"]},
        {id: "D", paises: ["Estados Unidos", "Paraguay", "Australia", "Turquía"]},
        {id: "E", paises: ["Alemania", "Ecuador", "Costa de Marfil", "Curazao"]},
        {id: "F", paises: ["Países Bajos", "Japón", "Suecia", "Túnez"]},
        {id: "G", paises: ["Bélgica", "Egipto", "Irán", "Nueva Zelanda"]},
        {id: "H", paises: ["España", "Uruguay", "Cabo Verde", "Arabia Saudita"]},
        {id: "I", paises: ["Francia", "Senegal", "Noruega", "Irak"]},
        {id: "J", paises: ["Argentina", "Argelia", "Austria", "Jordania"]},
        {id: "K", paises: ["Portugal", "Colombia", "Uzbekistán", "R. D. del Congo"]},
        {id: "L", paises: ["Inglaterra", "Croacia", "Ghana", "Panamá"]}
    ];

    let currentIdx = 0;
    let activeTeam = "";
    let myStickers = []; // En esta versión sin login, los datos se pierden al recargar

    function renderGroup() {
        const g = grupos[currentIdx];
        document.getElementById('grp-name').innerText = "GRUPO " + g.id;
        const list = document.getElementById('team-list');
        list.innerHTML = "";
        g.paises.forEach(p => {
            const d = document.createElement('div');
            d.className = 'team-item';
            d.onclick = () => { 
                activeTeam = p; 
                document.getElementById('current-team-title').innerText = p.toUpperCase(); 
                renderStickers(); 
            };
            d.innerHTML = `<img src="https://flagcdn.com/w40/${getIso(p)}.png" width="25" style="border: 1px solid #ddd;"> <span>${p.toUpperCase()}</span>`;
            list.appendChild(d);
        });
    }

    function renderStickers() {
        const grid = document.getElementById('sticker-grid');
        grid.innerHTML = "";
        for(let i=1; i<=20; i++) {
            const id = `${activeTeam}-${i}`;
            const owned = myStickers.includes(id);
            const s = document.createElement('div');
            s.className = `sticker ${owned ? 'owned' : ''}`;
            s.innerText = i;
            s.onclick = () => {
                if(myStickers.includes(id)) {
                    myStickers = myStickers.filter(x => x !== id);
                } else {
                    myStickers.push(id);
                }
                renderStickers();
            };
            grid.appendChild(s);
        }
    }

    function changeGroup(n) { 
        currentIdx = (currentIdx + n + grupos.length) % grupos.length; 
        renderGroup(); 
    }

    function getIso(name) {
        const codes = {"México":"mx", "Sudáfrica":"za", "Corea del Sur":"kr", "República Checa":"cz", "Canadá":"ca", "Bosnia y Herzegovina":"ba", "Qatar":"qa", "Suiza":"ch", "Brasil":"br", "Marruecos":"ma", "Haití":"ht", "Escocia":"gb-sct", "Estados Unidos":"us", "Paraguay":"py", "Australia":"au", "Turquía":"tr", "Alemania":"de", "Ecuador":"ec", "Costa de Marfil":"ci", "Curazao":"cw", "Países Bajos":"nl", "Japón":"jp", "Suecia":"se", "Túnez":"tn", "Bélgica":"be", "Egipto":"eg", "Irán":"ir", "Nueva Zelanda":"nz", "España":"es", "Uruguay":"uy", "Cabo Verde":"cv", "Arabia Saudita":"sa", "Francia":"fr", "Senegal":"sn", "Noruega":"no", "Irak":"iq", "Argentina":"ar", "Argelia":"dz", "Austria":"at", "Jordania":"jo", "Portugal":"pt", "Colombia":"co", "Uzbekistán":"uz", "R. D. del Congo":"cd", "Inglaterra":"gb-eng", "Croacia":"hr", "Ghana":"gh", "Panamá":"pa"};
        return codes[name] || "un";
    }

    // Inicializar la vista
    renderGroup();
</script>
</body>
</html>
