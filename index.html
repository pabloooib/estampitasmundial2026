<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Panini 2026</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/2026_FIFA_World_Cup_Logo.svg/256px-2026_FIFA_World_Cup_Logo.svg.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-green: #004d3d;
            --world-cup-blue: #001b3a;
            --world-cup-purple: #4a148c;
            --world-cup-yellow: #ffeb3b;
            --instagram-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #000;
            color: white; min-height: 100vh; overflow: hidden;
        }

        /* --- ANIMACIÓN ESPACIAL MEJORADA --- */
        #intro-space {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1), visibility 2s;
        }

        .star-field {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            animation: zoomStar 4s infinite ease-in;
        }

        @keyframes zoomStar {
            0% { transform: scale(0) translate(0, 0); opacity: 0; }
            20% { opacity: 0.8; }
            100% { transform: scale(1.5) translate(var(--x), var(--y)); opacity: 0; }
        }

        .earth-intro {
            width: 150px;
            height: 150px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png');
            background-size: cover;
            filter: drop-shadow(0 0 30px rgba(0, 140, 255, 0.4));
            animation: approachEarth 5s forwards ease-in-out;
            z-index: 3001;
        }

        @keyframes approachEarth {
            0% { transform: scale(0.05) rotate(0deg); opacity: 0; filter: brightness(0.5) blur(2px); }
            30% { opacity: 1; filter: brightness(1) blur(0px); }
            100% { transform: scale(25) rotate(15deg); opacity: 0; }
        }

        /* --- LOGIN AESTHETIC --- */
        .auth-container { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: radial-gradient(circle at top right, var(--world-cup-purple), var(--world-cup-blue));
            position: fixed; width: 100%; top: 0; z-index: 2000;
        }
        
        .auth-card { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 4rem 2rem; 
            border-radius: 40px; 
            border: 1px solid rgba(255,255,255,0.1); 
            text-align: center; 
            backdrop-filter: blur(30px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 90%; max-width: 420px;
            animation: fadeIn 1s ease-out 3s both;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        .google-btn {
            background: white; color: #111; border: none; padding: 16px;
            border-radius: 15px; cursor: pointer; width: 100%; font-weight: 900;
            margin-top: 30px; display: flex; align-items: center; justify-content: center; 
            gap: 12px; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .google-btn:hover { transform: scale(1.02); background: var(--world-cup-yellow); }

        /* --- RESTO DEL SISTEMA --- */
        #app { display: none; }
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1100; cursor: pointer; background: var(--world-cup-yellow); color: black; padding: 12px 18px; border-radius: 12px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; display: none; }
        #menu-overlay.active { display: block; }
        
        nav { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(25px); z-index: 1100; padding-top: 80px; border-right: 2px solid var(--world-cup-yellow); }
        nav.active { left: 0; }
        nav a { display: block; padding: 18px 30px; color: white; text-decoration: none; font-family: 'Oswald'; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .view { display: none; max-width: 1100px; margin: 90px auto 20px auto; padding: 0 20px; }
        .view.active { display: block; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; }
        .sticker { aspect-ratio: 2/3; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .sticker.owned { background: var(--world-cup-yellow); color: black; font-weight: 900; }
        .buy-btn { background: var(--world-cup-yellow); color: black; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-family: 'Oswald'; }
    </style>
</head>
<body>

    <div id="intro-space">
        <div class="earth-intro"></div>
    </div>

    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <h1 style="font-family:'Oswald'; color:var(--world-cup-yellow); font-size: 3.5rem; letter-spacing: -2px;">PANINI 2026</h1>
            <p id="auth-status" style="margin-top: 10px; font-size: 1rem; opacity: 0.7; font-weight: 300;">PREPARANDO EXPERIENCIA...</p>
            <button class="google-btn" id="loginBtn" onclick="loginWithGoogle()" style="display: none;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                ACCEDER CON GOOGLE
            </button>
        </div>
    </div>

    <div id="app">
        <div class="menu-toggle" onclick="toggleMenu()">☰ MENU</div>
        
        <nav id="sidebar">
            <div style="padding: 20px; text-align: center;"><h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">PANINI 2026</h2></div>
            <a href="#" onclick="showView('album-view')">📔 MI PROGRESO</a>
            <a href="#" onclick="handleLogout()" style="color: #ff5252; margin-top: 20px;">🚪 CERRAR SESIÓN</a>
        </nav>

        <div id="album-view" class="view active">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div class="card">
                    <h3 id="grp-name" style="font-family:'Oswald'; color:var(--world-cup-yellow);">GRUPO A</h3>
                    <div id="team-list" style="margin-top:15px;"></div>
                </div>
                <div class="card">
                    <h2 id="current-team-title" style="font-family:'Oswald'; border-bottom: 2px solid var(--world-cup-yellow);">SELECCIONA PAÍS</h2>
                    <div class="sticker-grid" id="sticker-grid" style="margin-top:20px;"></div>
                </div>
            </div>
        </div>
    </div>

<script>
    function startIntro() {
        const intro = document.getElementById('intro-space');
        // Generar estrellas cinéticas
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star-field';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.left = '50%';
            star.style.top = '50%';
            
            // Ángulo aleatorio para la trayectoria
            const angle = Math.random() * Math.PI * 2;
            const dist = 800 + Math.random() * 1000;
            star.style.setProperty('--x', Math.cos(angle) * dist + 'px');
            star.style.setProperty('--y', Math.sin(angle) * dist + 'px');
            star.style.animationDelay = Math.random() * 4 + 's';
            intro.appendChild(star);
        }

        setTimeout(() => {
            intro.style.opacity = '0';
            document.body.style.overflow = 'auto';
            setTimeout(() => intro.style.visibility = 'hidden', 2000);
        }, 4000);
    }
    startIntro();

    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        const authScreen = document.getElementById('auth-screen');
        const app = document.getElementById('app');
        if(user) {
            authScreen.style.display = 'none';
            app.style.display = 'block';
        } else {
            authScreen.style.display = 'flex';
            app.style.display = 'none';
            setTimeout(() => {
                document.getElementById('loginBtn').style.display = 'flex';
                document.getElementById('auth-status').innerText = "BIENVENIDO AL MUNDIAL";
            }, 3500);
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function handleLogout() {
        auth.signOut().then(() => window.location.reload());
    }

    function toggleMenu() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('menu-overlay').classList.toggle('active');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        toggleMenu(); 
    }
</script>
</body>
</html>
