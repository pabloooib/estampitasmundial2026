<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Panini 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-blue: #001b3a;
            --world-cup-purple: #4a148c;
            --world-cup-yellow: #ffeb3b;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: radial-gradient(circle at top right, var(--world-cup-purple), var(--world-cup-blue));
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- LOGIN --- */
        .auth-container { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80');
            background-size: cover; position: fixed; width: 100%; top: 0; z-index: 2000;
        }
        .auth-card { 
            background: rgba(255, 255, 255, 0.1); padding: 2rem; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); text-align: center; backdrop-filter: blur(20px);
            width: 90%; max-width: 400px;
        }
        .logo-mundial { width: 120px; margin-bottom: 20px; }

        /* --- APP --- */
        #app { display: none; }

        .menu-toggle { 
            position: fixed; top: 20px; left: 20px; z-index: 1000; cursor: pointer; 
            background: var(--world-cup-yellow); color: black; padding: 12px 18px; 
            border-radius: 12px; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        nav {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: rgba(0, 0, 0, 0.98); backdrop-filter: blur(20px);
            z-index: 1500; padding-top: 20px; border-right: 2px solid var(--world-cup-yellow);
        }
        nav.active { left: 0; }
        
        .close-menu {
            text-align: right; padding: 10px 25px; font-size: 1.5rem; cursor: pointer; color: var(--world-cup-yellow);
        }

        nav a { display: block; padding: 18px 30px; color: white; text-decoration: none; font-family: 'Oswald'; border-bottom: 1px solid rgba(255,255,255,0.05); }
        nav a:hover { background: rgba(255,235,59,0.1); }

        .view { display: none; max-width: 1100px; margin: 90px auto 20px auto; padding: 0 20px; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        
        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .buy-btn { background: var(--world-cup-yellow); color: black; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-family: 'Oswald'; text-transform: uppercase; font-weight: 900; }

        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1400; display: none;
        }
        #menu-overlay.active { display: block; }
    </style>
</head>
<body>

    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/2026_FIFA_World_Cup_Logo.svg" class="logo-mundial" alt="Mundial 2026">
            <h1 style="font-family:'Oswald'; color:var(--world-cup-yellow); font-size: 2rem; margin-bottom: 10px;">PANINI 2026</h1>
            <p id="auth-status" style="font-size: 0.9rem;">Cargando sistema...</p>
            <button class="google-btn" id="loginBtn" onclick="loginWithGoogle()" style="display: none; background: white; color: black; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 20px; font-weight: bold; cursor: pointer;">
                Entrar con Google
            </button>
        </div>
    </div>

    <div id="app">
        <div class="menu-toggle" onclick="toggleMenu()">☰ MENU</div>

        <nav id="sidebar">
            <div class="close-menu" onclick="toggleMenu()">✕</div>
            <div style="padding: 10px 30px; text-align: center;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/2026_FIFA_World_Cup_Logo.svg" width="80" alt="Logo Mundial">
            </div>
            <a href="#" onclick="showView('album-view')">📔 MI PROGRESO</a>
            <a href="#" onclick="showView('special-card-view')">⭐ CARTA ESPECIAL</a>
            <a href="#" onclick="showView('stock-view')">💎 CARTAS EN STOCK</a>
            <a href="#" onclick="showView('shop-view')">🛒 TIENDA</a>
            <a href="#" onclick="showView('prices-view')">💰 LISTA DE PRECIOS</a>
            <a href="#" onclick="handleLogout()" style="color: #ff5252; margin-top: 20px;">🚪 CERRAR SESIÓN</a>
        </nav>

        <div id="album-view" class="view active">
            <div class="card">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">BIENVENIDO AL ÁLBUM</h2>
                <p>Selecciona un grupo para comenzar a coleccionar.</p>
                </div>
        </div>

        </div>

<script>
    // Tu configuración de Firebase actual
    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // --- MANEJO DEL MENÚ ---
    function toggleMenu() { 
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('menu-overlay');
        sidebar.classList.toggle('active'); 
        overlay.classList.toggle('active');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        toggleMenu(); // Cierra el menú al cambiar de vista
    }

    // --- AUTENTICACIÓN ---
    auth.onAuthStateChanged(user => {
        const authScreen = document.getElementById('auth-screen');
        const app = document.getElementById('app');
        const loginBtn = document.getElementById('loginBtn');

        if(user) {
            authScreen.style.display = 'none';
            app.style.display = 'block';
        } else {
            authScreen.style.display = 'flex';
            app.style.display = 'none';
            loginBtn.style.display = 'block';
            document.getElementById('auth-status').innerText = "Inicia sesión para entrar";
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function handleLogout() {
        auth.signOut().then(() => window.location.reload());
    }
</script>
</body>
</html>
