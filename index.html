<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUVREIGN | Panini World Cup 2026</title>
    
    <link rel="icon" type="image/jpeg" href="imagenmundial.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <!-- Firebase (Versión Compat para estabilidad) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --gold: #ffeb3b;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #00d2ff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #000;
            background-image: radial-gradient(circle at 50% 0%, #001b3a 0%, #000 70%);
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- NAVEGACIÓN --- */
        .navbar-top {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(0, 5, 15, 0.8); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1500; border-bottom: 1px solid var(--glass-border);
        }

        .menu-toggle { cursor: pointer; display: flex; flex-direction: column; gap: 6px; z-index: 1600; }
        .bar { width: 25px; height: 3px; background: var(--gold); transition: 0.4s; border-radius: 2px; }
        .menu-active .bar:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .menu-active .bar:nth-child(2) { opacity: 0; }
        .menu-active .bar:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        nav {
            position: fixed; top: 0; left: -100%; width: 280px; height: 100vh;
            background: rgba(0, 8, 20, 0.98); backdrop-filter: blur(30px);
            z-index: 1550; padding: 100px 0; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            border-right: 1px solid var(--glass-border);
        }
        nav.active { left: 0; }

        .nav-link {
            padding: 16px 30px; color: rgba(255,255,255,0.6); text-decoration: none;
            font-family: 'Oswald'; display: flex; align-items: center; gap: 15px;
            font-size: 1.1rem; transition: 0.3s;
        }
        .nav-link:hover, .nav-link.active-sec { color: var(--gold); background: rgba(255,235,59,0.05); }

        /* --- CONTENIDO PRINCIPAL --- */
        .view { display: none; padding: 100px 15px 120px; max-width: 1200px; margin: auto; animation: fadeIn 0.5s ease; }
        .view.active { display: block; }

        /* --- ESTÉTICA DE GRUPOS --- */
        .group-block { margin-bottom: 50px; }
        .group-header { 
            font-family: 'Oswald'; font-size: 1.5rem; color: var(--gold); 
            border-bottom: 2px solid var(--gold); display: inline-block;
            margin-bottom: 20px; padding-right: 40px;
        }

        .countries-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .country-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            border-radius: 15px; padding: 15px;
        }

        .country-info {
            display: flex; align-items: center; gap: 12px; margin-bottom: 15px;
        }
        .flag-img { width: 35px; height: 24px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
        .country-name { font-family: 'Oswald'; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        .stickers-row {
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
        }
        .sticker-box {
            background: rgba(255,255,255,0.03); border: 1px solid var(--glass-border);
            aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
            font-family: 'Oswald'; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.8rem;
        }
        .sticker-box.selected { background: var(--gold); color: #000; border-color: var(--gold); transform: scale(1.05); }

        /* --- CARTAS EXTRA JPG --- */
        .extras-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }
        .extra-card {
            position: relative; border-radius: 20px; overflow: hidden;
            aspect-ratio: 3/4.5; cursor: pointer; border: 1px solid var(--glass-border);
        }
        .extra-card img { width: 100%; height: 100%; object-fit: cover; }
        .extra-card.selected { border: 3px solid var(--gold); box-shadow: 0 0 30px rgba(255,235,59,0.3); }
        .card-name {
            position: absolute; bottom: 0; width: 100%; padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            font-family: 'Oswald'; text-align: center;
        }

        /* --- PERFIL --- */
        .profile-card {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 40px; border-radius: 20px; text-align: center;
        }
        .profile-img { width: 100px; height: 100px; background: var(--gold); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: #000; font-size: 2rem; font-weight: 900; }

        /* --- FOOTER --- */
        .footer-action {
            position: fixed; bottom: 0; width: 100%; padding: 20px;
            background: rgba(0,8,20,0.9); backdrop-filter: blur(15px);
            border-top: 1px solid var(--gold); transform: translateY(100%);
            transition: 0.4s; z-index: 1000; text-align: center;
        }
        .footer-action.visible { transform: translateY(0); }
        .btn-send { background: var(--gold); color: #000; border: none; padding: 15px 60px; border-radius: 12px; font-family: 'Oswald'; font-weight: 700; width: 100%; max-width: 400px; cursor: pointer; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1520; display: none; }
        .overlay.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .countries-grid { grid-template-columns: 1fr; }
            .stickers-row { grid-template-columns: repeat(5, 1fr); }
            nav { width: 80%; }
        }
    </style>
</head>
<body>

    <header class="navbar-top">
        <div class="menu-toggle" onclick="toggleMenu()" id="menuBtn">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <img src="panini.jpg" alt="Logo" style="height: 30px;">
        <div style="width: 25px;"></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav id="sidebar">
        <!-- Perfil de primero como solicitado -->
        <a href="#" class="nav-link" onclick="showView('profile-view', this)"><span>🧑</span> MI PERFIL</a>
        <a href="#" class="nav-link active-sec" onclick="showView('album-view', this)"><span>📋</span> ÁLBUM DE CARTAS</a>
        <a href="#" class="nav-link" onclick="showView('extras-view', this)"><span>🌟</span> CARTAS EXTRA</a>
        <div style="margin-top: 40px; padding: 0 30px;">
            <button onclick="location.reload()" style="width:100%; padding:10px; background:none; border:1px solid #ff5252; color:#ff5252; border-radius:8px; font-family:'Oswald'; cursor:pointer;">CERRAR SESIÓN</button>
        </div>
    </nav>

    <main>
        <!-- VISTA PERFIL -->
        <div id="profile-view" class="view">
            <div class="profile-card">
                <div class="profile-img">JP</div>
                <h2 style="font-family:'Oswald'; margin-bottom:10px;">JOSE PABLO (JP)</h2>
                <p style="opacity:0.6;">Industrial Engineer | SOUVREIGN Collector</p>
                <div style="margin-top:30px; padding:15px; border:1px dashed var(--glass-border); border-radius:10px;">
                    <p style="font-size:0.9rem; color:var(--gold);">STATUS: COLECCIONISTA ELITE</p>
                </div>
            </div>
        </div>

        <!-- VISTA ÁLBUM (TODOS LOS GRUPOS A-L) -->
        <div id="album-view" class="view active">
            <div id="album-root"></div>
        </div>

        <!-- VISTA EXTRAS -->
        <div id="extras-view" class="view">
            <h1 style="font-family:'Oswald'; margin-bottom:30px; text-align:center;">LEGENDS & SPECIALS</h1>
            <div class="extras-grid">
                <div class="extra-card" onclick="toggleSelection(this, 'MESSI LEGEND')">
                    <img src="imagenmessi.jpg" alt="Messi">
                    <div class="card-name"><h3>LIONEL MESSI</h3></div>
                </div>
                <div class="extra-card" onclick="toggleSelection(this, 'CR7 LEGEND')">
                    <img src="imagencristianomundial.jpg" alt="CR7">
                    <div class="card-name"><h3>C. RONALDO</h3></div>
                </div>
                <div class="extra-card" onclick="toggleSelection(this, 'SOUVREIGN SPECIAL')">
                    <img src="panini.jpg" alt="Logo" style="object-fit: contain; padding:40px; background:#fff;">
                    <div class="card-name"><h3 style="color:#000">LOGO GOLD</h3></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-order" class="footer-action">
        <button class="btn-send" onclick="sendWhatsApp()">SOLICITAR SELECCIONADAS (<span id="count">0</span>)</button>
    </div>

    <script>
        const GROUPS_DATA = [
            {id: "GRUPO A", countries: ["México", "Sudáfrica", "República de Corea", "República Checa"], codes: ["mx","za","kr","cz"]},
            {id: "GRUPO B", countries: ["Canadá", "Bosnia y Herzegovina", "Qatar", "Suiza"], codes: ["ca","ba","qa","ch"]},
            {id: "GRUPO C", countries: ["Brasil", "Marruecos", "Haití", "Escocia"], codes: ["br","ma","ht","gb-sct"]},
            {id: "GRUPO D", countries: ["Estados Unidos", "Paraguay", "Australia", "Türkiye"], codes: ["us","py","au","tr"]},
            {id: "GRUPO E", countries: ["Alemania", "Curazao", "Costa de Marfil", "Ecuador"], codes: ["de","cw","ci","ec"]},
            {id: "GRUPO F", countries: ["Países Bajos", "Japón", "Túnez", "Albania"], codes: ["nl","jp","tn","al"]},
            {id: "GRUPO G", countries: ["Bélgica", "Egipto", "Irán", "Nueva Zelanda"], codes: ["be","eg","ir","nz"]},
            {id: "GRUPO H", countries: ["España", "Uruguay", "Arabia Saudita", "Cabo Verde"], codes: ["es","uy","sa","cv"]},
            {id: "GRUPO I", countries: ["Francia", "Senegal", "Noruega", "Irak"], codes: ["fr","sn","no","iq"]},
            {id: "GRUPO J", countries: ["Argentina", "Austria", "Argelia", "Jordania"], codes: ["ar","at","dz","jo"]},
            {id: "GRUPO K", countries: ["Portugal", "Colombia", "Uzbekistán", "Jamaica"], codes: ["pt","co","uz","jm"]},
            {id: "GRUPO L", countries: ["Inglaterra", "Croacia", "Ghana", "Panamá"], codes: ["gb-eng","hr","gh","pa"]}
        ];

        let selection = new Set();

        function renderAlbum() {
            const root = document.getElementById('album-root');
            GROUPS_DATA.forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.className = 'group-block';
                
                let countriesHtml = '';
                group.countries.forEach((name, index) => {
                    const code = group.codes[index];
                    countriesHtml += `
                        <div class="country-card">
                            <div class="country-info">
                                <img src="https://flagcdn.com/${code}.svg" class="flag-img">
                                <span class="country-name">${name}</span>
                            </div>
                            <div class="stickers-row">
                                ${Array.from({length: 10}, (_, i) => `
                                    <div class="sticker-box" onclick="toggleSelection(this, '${name} #${i+1}')">
                                        ${i+1}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });

                groupDiv.innerHTML = `
                    <h2 class="group-header">${group.id}</h2>
                    <div class="countries-grid">${countriesHtml}</div>
                `;
                root.appendChild(groupDiv);
            });
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('menuBtn').classList.toggle('menu-active');
        }

        function showView(id, link) {
            if(window.innerWidth < 768) toggleMenu();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-sec'));
            link.classList.add('active-sec');
            window.scrollTo(0,0);
        }

        function toggleSelection(el, id) {
            el.classList.toggle('selected');
            if(selection.has(id)) selection.delete(id);
            else selection.add(id);
            
            document.getElementById('count').innerText = selection.size;
            document.getElementById('footer-order').classList.toggle('visible', selection.size > 0);
            if(navigator.vibrate) navigator.vibrate(15);
        }

        function sendWhatsApp() {
            const list = Array.from(selection).sort().join('\n- ');
            const text = encodeURIComponent(`¡Hola! Soy JP. Solicito estas cartas:\n\n- ${list}`);
            window.open(`https://wa.me/50246199644?text=${text}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', renderAlbum);
    </script>
</body>
</html>
