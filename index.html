<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUVREIGN | Panini Digital 2026</title>
    
    <!-- Fuentes y Recursos -->
    <link rel="icon" type="image/jpeg" href="imagenmundial.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <!-- SDK Firebase (Versión Compat para estabilidad) -->
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-yellow: #ffeb3b;
            --premium-gold: #bf953f;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --bg-dark: #001b3a;
            --deep-blue: #000c1d;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: radial-gradient(circle at top right, #1a0a2e, #001b3a, #000);
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- 1. NAVBAR & NAVIGATION PREMIUM --- */
        .navbar-top {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(0, 5, 15, 0.85); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 1500; border-bottom: 1px solid var(--glass-border);
        }

        .menu-toggle {
            cursor: pointer; display: flex; flex-direction: column; gap: 6px;
            z-index: 1600; padding: 10px;
        }
        .bar { width: 28px; height: 3px; background: var(--world-cup-yellow); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 2px; }
        .menu-active .bar:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .menu-active .bar:nth-child(2) { opacity: 0; transform: translateX(-10px); }
        .menu-active .bar:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        nav {
            position: fixed; top: 0; left: -100%; width: 320px; height: 100vh;
            background: rgba(0, 8, 20, 0.98); backdrop-filter: blur(40px);
            z-index: 1550; padding: 90px 0; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 20px 0 50px rgba(0,0,0,0.5); border-right: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
        }
        nav.active { left: 0; }

        .nav-link {
            padding: 18px 35px; color: rgba(255,255,255,0.7); text-decoration: none;
            font-family: 'Oswald'; display: flex; align-items: center; gap: 15px;
            font-size: 1.1rem; letter-spacing: 1px; transition: 0.3s;
            position: relative;
        }
        .nav-link:hover, .nav-link.active-sec { color: var(--world-cup-yellow); background: rgba(255,235,59,0.05); }
        .nav-link.active-sec::before {
            content: ''; position: absolute; left: 0; top: 20%; height: 60%; 
            width: 4px; background: var(--world-cup-yellow); border-radius: 0 4px 4px 0;
            box-shadow: 0 0 15px var(--world-cup-yellow);
        }

        /* --- 4. INSTAGRAM BUTTON --- */
        .insta-float {
            position: fixed; right: 25px; bottom: 25px; z-index: 1400;
            background: linear-gradient(45deg, #f09433, #e54050, #962fbf, #4f5bd5);
            width: 55px; height: 55px; border-radius: 18px; display: flex;
            align-items: center; justify-content: center; text-decoration: none;
            box-shadow: 0 10px 30px rgba(225, 48, 108, 0.4); transition: 0.4s;
        }
        .insta-float:hover { transform: scale(1.1) rotate(8deg); }
        .insta-float svg { fill: white; width: 28px; height: 28px; }

        /* --- 2 & 3. EXTRA CARDS PREMIUM --- */
        .extra-card-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; margin-top: 30px;
        }
        .extra-card {
            background: var(--glass); border-radius: 24px; overflow: hidden;
            border: 1px solid var(--glass-border); position: relative;
            cursor: pointer; transition: 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            aspect-ratio: 3/4;
        }
        .extra-card:hover { 
            transform: translateY(-12px); border-color: var(--world-cup-yellow);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .extra-card img {
            width: 100%; height: 100%; object-fit: cover;
            transition: 0.8s ease; filter: brightness(0.9);
        }
        .extra-card:hover img { transform: scale(1.08); filter: brightness(1.1); }
        
        .extra-card.selected { border: 3px solid var(--world-cup-yellow); }
        .extra-card.selected::after {
            content: '✓'; position: absolute; top: 15px; right: 15px;
            background: var(--world-cup-yellow); color: black;
            width: 35px; height: 35px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: 900;
            animation: popIn 0.3s forwards;
        }

        .card-info {
            padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            position: absolute; bottom: 0; width: 100%;
        }
        .card-info h3 { font-family: 'Oswald'; font-size: 1.4rem; color: #fff; }

        /* --- 5. GRID DE STICKERS (ALBUM) --- */
        .countries-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px; margin-top: 20px;
        }
        .sticker-item {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 12px; text-align: center;
            font-family: 'Oswald'; cursor: pointer; transition: 0.3s;
        }
        .sticker-item:hover { background: rgba(255,255,255,0.15); border-color: var(--world-cup-yellow); }
        .sticker-item.selected { 
            background: var(--world-cup-yellow); color: black; 
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.5); 
        }

        /* --- UI HELPERS --- */
        .view { display: none; padding: 100px 20px 100px; max-width: 1200px; margin: auto; animation: fadeIn 0.5s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            z-index: 1520; display: none;
        }
        .overlay.active { display: block; }

        /* FOOTER DE ACCIÓN */
        .action-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px;
            background: rgba(0, 5, 15, 0.9); backdrop-filter: blur(15px);
            border-top: 1px solid var(--world-cup-yellow); z-index: 1000;
            display: flex; justify-content: center; transform: translateY(100%); transition: 0.4s;
        }
        .action-footer.visible { transform: translateY(0); }
        .btn-send {
            background: var(--world-cup-yellow); color: black; border: none;
            padding: 15px 40px; border-radius: 12px; font-family: 'Oswald';
            font-weight: 700; width: 100%; max-width: 400px; cursor: pointer;
        }

        @media (max-width: 768px) {
            nav { width: 85%; }
            .navbar-top { padding: 0 15px; }
            .countries-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR ESTRUCTURAL -->
    <header class="navbar-top">
        <div class="menu-toggle" onclick="toggleMenu()" id="menuBtn">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <img src="panini" alt="Panini" style="height: 35px;">
        <div style="width: 48px;"></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <!-- NAVEGACIÓN -->
    <nav id="sidebar">
        <div style="padding: 0 35px 20px;">
            <p style="font-family:'Oswald'; color:var(--world-cup-yellow); letter-spacing: 2px; font-size: 0.7rem;">SOUVREIGN OS</p>
        </div>
        <a href="#" class="nav-link active-sec" onclick="showView('album-view', this)">📋 LISTADO DE CARTAS</a>
        <a href="#" class="nav-link" onclick="showView('extras-view', this)">🌟 CARTAS EXTRA</a>
        <a href="#" class="nav-link" onclick="showView('profile-view', this)">🧑 MI PERFIL</a>
        <div style="margin-top: auto; padding: 30px;">
            <button onclick="logout()" style="width:100%; padding:12px; background:transparent; border:1px solid #ff5252; color:#ff5252; border-radius:8px; font-family:'Oswald'; cursor:pointer;">SALIR</button>
        </div>
    </nav>

    <!-- INSTAGRAM FIJO -->
    <a href="https://instagram.com/pablooib" target="_blank" class="insta-float">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.266.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.267-.07-1.646-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.058-1.69-.072-4.949-.072zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.209-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
    </a>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <!-- VISTA ÁLBUM -->
        <div id="album-view" class="view active">
            <h1 style="font-family:'Oswald'; font-size: 2.2rem; margin-bottom: 20px;">SELECCIÓN 2026</h1>
            
            <div id="album-container">
                <!-- Se inyectan dinámicamente los países aquí -->
            </div>
        </div>

        <!-- VISTA CARTAS EXTRA -->
        <div id="extras-view" class="view">
            <h1 style="font-family:'Oswald'; font-size: 2.2rem; margin-bottom: 5px;">LEGENDARY CARDS</h1>
            <p style="opacity: 0.6; margin-bottom: 30px;">Ediciones especiales de colección premium</p>
            
            <div class="extra-card-container">
                <div class="extra-card" onclick="toggleExtra(this, 'Lionel Messi')">
                    <img src="imagenmessi" alt="Messi">
                    <div class="card-info">
                        <h3>LIONEL MESSI</h3>
                        <p style="color:var(--world-cup-yellow); font-size:0.8rem; font-weight:700;">GOLDEN LEGEND</p>
                    </div>
                </div>

                <div class="extra-card" onclick="toggleExtra(this, 'Cristiano Ronaldo')">
                    <img src="imagencristianomundial" alt="CR7">
                    <div class="card-info">
                        <h3>CRISTIANO RONALDO</h3>
                        <p style="color:var(--world-cup-yellow); font-size:0.8rem; font-weight:700;">WORLD ICON</p>
                    </div>
                </div>

                <div class="extra-card" onclick="toggleExtra(this, 'Logo Panini')">
                    <img src="panini" alt="Logo" style="object-fit: contain; background: white; padding: 40px;">
                    <div class="card-info">
                        <h3 style="color:#000">PANINI OFFICIAL</h3>
                        <p style="color:#e54050; font-size:0.8rem; font-weight:700;">AUTHENTIC</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- VISTA PERFIL -->
        <div id="profile-view" class="view">
            <h1 style="font-family:'Oswald';">MI PERFIL</h1>
            <div id="user-stats" style="margin-top:20px; background:var(--glass); padding:20px; border-radius:15px;">
                <p id="user-email">Cargando datos...</p>
            </div>
        </div>
    </main>

    <!-- FOOTER PARA PEDIDOS -->
    <div id="footer-order" class="action-footer">
        <button class="btn-send" onclick="sendOrder()">PEDIR SELECCIONADAS (<span id="total-selected">0</span>)</button>
    </div>

    <script>
        // --- CONFIGURACIÓN DE DATOS ---
        const COUNTRIES = [
            { name: 'ARGENTINA', stickers: 19 },
            { name: 'PORTUGAL', stickers: 19 },
            { name: 'BRASIL', stickers: 19 },
            { name: 'ESPAÑA', stickers: 19 },
            { name: 'ALEMANIA', stickers: 19 },
            { name: 'FRANCIA', stickers: 19 }
        ];

        let selectedStickers = new Set();

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            renderAlbum();
            checkAuth();
        });

        function renderAlbum() {
            const container = document.getElementById('album-container');
            COUNTRIES.forEach(country => {
                const section = document.createElement('div');
                section.innerHTML = `
                    <h2 style="font-family:'Oswald'; margin: 30px 0 15px; color: var(--world-cup-yellow); border-bottom: 1px solid var(--glass-border); padding-bottom: 5px;">${country.name}</h2>
                    <div class="countries-grid">
                        ${Array.from({length: country.stickers}, (_, i) => `
                            <div class="sticker-item" onclick="toggleSticker(this, '${country.name} ${i+1}')">
                                ${country.name.substring(0,3)} ${i+1}
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(section);
            });
        }

        // --- LÓGICA DE INTERACCIÓN ---
        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('menuBtn').classList.toggle('menu-active');
        }

        function showView(viewId, link) {
            if(window.innerWidth < 768) toggleMenu();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-sec'));
            link.classList.add('active-sec');
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function toggleSticker(el, id) {
            el.classList.toggle('selected');
            if(selectedStickers.has(id)) selectedStickers.delete(id);
            else selectedStickers.add(id);
            updateFooter();
        }

        function toggleExtra(el, id) {
            el.classList.toggle('selected');
            if(selectedStickers.has(id)) selectedStickers.delete(id);
            else selectedStickers.add(id);
            updateFooter();
        }

        function updateFooter() {
            const total = selectedStickers.size;
            document.getElementById('total-selected').innerText = total;
            document.getElementById('footer-order').classList.toggle('visible', total > 0);
        }

        function sendOrder() {
            const list = Array.from(selectedStickers).join(', ');
            const text = encodeURIComponent(`¡Hola! Quisiera solicitar estas cartas: ${list}`);
            window.open(`https://wa.me/50246199644?text=${text}`);
        }

        // --- FIREBASE PLACEHOLDERS ---
        function checkAuth() {
            // Aquí integrarías tu auth.onAuthStateChanged
            console.log("Sistema de autenticación activo");
        }

        function logout() {
            // firebase.auth().signOut()
            alert("Sesión cerrada");
            location.reload();
        }
    </script>
</body>
</html>
