<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUVREIGN | Panini Marketplace</title>
    
    <link rel="icon" type="image/jpeg" href="imagenmundial.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>

    <style>
        :root { 
            --gold: #ffeb3b;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --premium: #00d2ff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: #000; color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- LOGIN & DINAMIC WORLD --- */
        #login-screen {
            position: fixed; inset: 0; z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; overflow: hidden;
        }

        #world-bg {
            position: absolute; width: 150%; height: 150%;
            background: url('imagenmundial.jpg') no-repeat center;
            background-size: cover; opacity: 0.4;
            animation: rotateWorld 60s linear infinite;
        }

        @keyframes rotateWorld { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .login-card {
            position: relative; z-index: 2001; padding: 40px;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            text-align: center; width: 90%; max-width: 400px;
        }

        .btn-google {
            background: white; color: #000; border: none; padding: 15px 25px;
            border-radius: 12px; font-family: 'Oswald'; display: flex;
            align-items: center; justify-content: center; gap: 10px;
            width: 100%; cursor: pointer; transition: 0.3s;
        }

        /* --- INTERFAZ APP --- */
        .navbar-top {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(0, 5, 15, 0.8); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; z-index: 1500; border-bottom: 1px solid var(--glass-border);
        }

        nav {
            position: fixed; top: 0; left: -100%; width: 280px; height: 100vh;
            background: rgba(0, 8, 20, 0.98); backdrop-filter: blur(30px);
            z-index: 1550; padding: 100px 0; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        nav.active { left: 0; }

        .nav-link {
            padding: 16px 30px; color: rgba(255,255,255,0.6); text-decoration: none;
            font-family: 'Oswald'; display: flex; align-items: center; gap: 15px; font-size: 1.1rem;
        }
        .nav-link.active-sec { color: var(--gold); border-left: 4px solid var(--gold); }

        /* --- GRUPOS Y CARTAS --- */
        .view { display: none; padding: 100px 15px 150px; max-width: 1200px; margin: auto; }
        .view.active { display: block; }

        .group-block { margin-bottom: 50px; }
        .group-header { font-family: 'Oswald'; color: var(--gold); font-size: 1.8rem; margin-bottom: 20px; border-bottom: 2px solid var(--gold); }

        .countries-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .country-card { background: var(--glass); border-radius: 20px; padding: 20px; border: 1px solid var(--glass-border); }
        .country-info { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .flag-img { width: 40px; border-radius: 5px; }

        .stickers-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .sticker {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: 'Oswald';
        }
        .sticker.selected { background: var(--gold); color: #000; border-color: var(--gold); transform: scale(1.05); }
        .sticker small { font-size: 0.6rem; opacity: 0.7; }

        /* --- EXTRAS --- */
        .extras-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .extra-card { border-radius: 20px; overflow: hidden; aspect-ratio: 3/4.5; cursor: pointer; border: 1px solid var(--glass-border); position: relative; }
        .extra-card img { width: 100%; height: 100%; object-fit: cover; }
        .extra-card.selected { border: 3px solid var(--gold); }

        /* --- FOOTER TOTAL --- */
        .footer-action {
            position: fixed; bottom: 0; width: 100%; padding: 20px;
            background: rgba(0,8,20,0.95); backdrop-filter: blur(15px);
            border-top: 1px solid var(--gold); transform: translateY(100%);
            transition: 0.4s; z-index: 1000; display: flex; flex-direction: column; align-items: center;
        }
        .footer-action.visible { transform: translateY(0); }
        .total-price { font-family: 'Oswald'; font-size: 1.5rem; color: var(--gold); margin-bottom: 10px; }
        .btn-send { background: var(--gold); color: #000; border: none; padding: 15px 60px; border-radius: 12px; font-family: 'Oswald'; font-weight: 700; cursor: pointer; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1520; display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen">
        <div id="world-bg"></div>
        <div class="login-card">
            <img src="panini.jpg" style="width: 150px; margin-bottom: 20px;">
            <h1 style="font-family:'Oswald'; margin-bottom: 10px;">BIENVENIDO</h1>
            <p style="opacity:0.7; margin-bottom:30px;">Inicia sesión para armar tu pedido</p>
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" width="20">
                CONTINUAR CON GOOGLE
            </button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-content" style="display: none;">
        <header class="navbar-top">
            <div onclick="toggleMenu()" style="cursor:pointer; color:var(--gold); font-size:1.5rem;">☰</div>
            <img src="panini.jpg" height="30">
            <div id="user-avatar" style="width:35px; height:35px; border-radius:50%; background:var(--gold); color:#000; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:0.8rem;">JP</div>
        </header>

        <nav id="sidebar">
            <a href="#" class="nav-link" onclick="showView('profile-view', this)"><span>🧑</span> MI PERFIL</a>
            <a href="#" class="nav-link active-sec" onclick="showView('album-view', this)"><span>📋</span> ÁLBUM (20 CARTAS/PAÍS)</a>
            <a href="#" class="nav-link" onclick="showView('extras-view', this)"><span>🌟</span> CARTAS EXTRA</a>
            <div style="padding: 30px;"><button onclick="logout()" style="background:none; border:1px solid #ff5252; color:#ff5252; width:100%; padding:10px; border-radius:8px; cursor:pointer;">SALIR</button></div>
        </nav>

        <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

        <main>
            <div id="profile-view" class="view">
                <div style="background:var(--glass); padding:40px; border-radius:25px; text-align:center;">
                    <h2 id="user-name" style="font-family:'Oswald';">CARGANDO...</h2>
                    <p id="user-email" style="opacity:0.6;"></p>
                </div>
            </div>

            <div id="album-view" class="view active">
                <div id="album-root"></div>
            </div>

            <div id="extras-view" class="view">
                <div class="extras-grid">
                    <div class="extra-card" onclick="toggleSelection(this, 'MESSI LEGEND', 50)">
                        <img src="imagenmessi.jpg">
                        <div style="position:absolute; bottom:0; background:rgba(0,0,0,0.8); width:100%; text-align:center; padding:10px;">MESSI GOLD - Q50</div>
                    </div>
                    <div class="extra-card" onclick="toggleSelection(this, 'CR7 LEGEND', 50)">
                        <img src="cristianomundial.jpg">
                        <div style="position:absolute; bottom:0; background:rgba(0,0,0,0.8); width:100%; text-align:center; padding:10px;">CR7 LEGACY - Q50</div>
                    </div>
                </div>
            </div>
        </main>

        <div id="footer-order" class="footer-action">
            <div class="total-price">TOTAL: Q<span id="total-val">0.00</span></div>
            <button class="btn-send" onclick="sendWhatsApp()">PEDIR POR WHATSAPP</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "souvreign.firebaseapp.com" }; // Sustituir con tu config real
        firebase.initializeApp(firebaseConfig);

        const GROUPS = [
            {id: "A", countries: [{n:"México",c:"mx"}, {n:"Sudáfrica",c:"za"}, {n:"Corea",c:"kr"}, {n:"Rep. Checa",c:"cz"}]},
            {id: "J", countries: [{n:"Argentina",c:"ar"}, {n:"Austria",c:"at"}, {n:"Argelia",c:"dz"}, {n:"Jordania",c:"jo"}]},
            {id: "I", countries: [{n:"Francia",c:"fr"}, {n:"Senegal",c:"sn"}, {n:"Noruega",c:"no"}, {n:"Irak",c:"iq"}]},
            {id: "K", countries: [{n:"Portugal",c:"pt"}, {n:"Colombia",c:"co"}, {n:"Uzbekistán",c:"uz"}, {n:"Jamaica",c:"jm"}]}
        ];

        let selection = [];
        let total = 0;

        function renderAlbum() {
            const root = document.getElementById('album-root');
            GROUPS.forEach(g => {
                const gDiv = document.createElement('div');
                gDiv.className = 'group-block';
                gDiv.innerHTML = `<h2 class="group-header">GRUPO ${g.id}</h2><div class="countries-grid"></div>`;
                const grid = gDiv.querySelector('.countries-grid');

                g.countries.forEach(c => {
                    const cDiv = document.createElement('div');
                    cDiv.className = 'country-card';
                    let stickers = '';
                    for(let i=1; i<=20; i++) {
                        let price = 2;
                        if(i === 1) price = 10;
                        if(i === 13) price = 15;
                        
                        // Lógica especial por país
                        if(c.n === "Argentina") {
                            if(i === 17) price = 30;
                            if(i === 19) price = 10;
                        }
                        if(c.n === "Portugal" && i === 15) price = 30;
                        if(c.n === "Francia") {
                            if(i === 20) price = 25;
                            if(i === 15) price = 10;
                        }

                        stickers += `<div class="sticker" onclick="toggleSelection(this, '${c.n} #${i}', ${price})">
                            ${i}<small>Q${price}</small>
                        </div>`;
                    }
                    cDiv.innerHTML = `<div class="country-info"><img class="flag-img" src="https://flagcdn.com/${c.c}.svg"><span>${c.n}</span></div>
                                      <div class="stickers-row">${stickers}</div>`;
                    grid.appendChild(cDiv);
                });
                root.appendChild(gDiv);
            });
        }

        function toggleSelection(el, id, price) {
            el.classList.toggle('selected');
            if(el.classList.contains('selected')) {
                selection.push({id, price});
                total += price;
            } else {
                selection = selection.filter(item => item.id !== id);
                total -= price;
            }
            document.getElementById('total-val').innerText = total.toFixed(2);
            document.getElementById('footer-order').classList.toggle('visible', total > 0);
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function showView(id, link) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-sec'));
            link.classList.add('active-sec');
            toggleMenu();
        }

        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            firebase.auth().signInWithPopup(provider).then(res => {
                updateUI(res.user);
            });
        }

        function updateUI(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-email').innerText = user.email;
            document.getElementById('user-avatar').innerText = user.displayName.charAt(0);
        }

        function sendWhatsApp() {
            const list = selection.map(s => `- ${s.id} (Q${s.price})`).join('%0A');
            const msg = `¡Hola! Soy ${document.getElementById('user-name').innerText}.%0AMi pedido:%0A${list}%0A%0ATOTAL: Q${total}`;
            window.open(`https://wa.me/50246199644?text=${msg}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', renderAlbum);
    </script>
</body>
</html>
