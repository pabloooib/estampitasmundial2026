<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANINI GUATEMALA | MUNDIAL 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fifa-blue: #004b87; --fifa-gold: #c6a15a; --fifa-green: #008f4c;
            --white: #ffffff; --bg: #f4f7f6; --text: #1a1a1a; --border: #dee2e6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); }
        #app { max-width: 600px; margin: 0 auto; background: var(--white); min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 40px rgba(0,0,0,0.1); }
        
        header { padding: 1.2rem; text-align: center; background: var(--fifa-blue); color: white; position: sticky; top: 0; z-index: 100; }
        .brand { font-family: 'Oswald', sans-serif; font-size: 1.4rem; letter-spacing: 2px; }

        nav { display: flex; background: #eee; }
        nav button { flex: 1; padding: 10px; border: none; font-size: 0.7rem; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        nav button.active { background: var(--fifa-gold); color: white; }

        main { flex: 1; padding: 1.5rem; }
        h2 { font-family: 'Oswald', sans-serif; font-size: 1.5rem; margin-bottom: 1rem; color: var(--fifa-blue); border-bottom: 2px solid var(--fifa-gold); display: inline-block; }

        /* Tienda */
        .shop-card { border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 15px; }
        .shop-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; background: #f9f9f9; }
        .shop-info h4 { font-size: 1rem; margin-bottom: 4px; }
        .price { color: var(--fifa-green); font-weight: bold; font-size: 1.1rem; }

        /* Album Digital */
        .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 1rem; }
        .sticker { aspect-ratio: 1; background: #eee; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; cursor: pointer; border: 2px solid transparent; }
        .sticker.have { background: var(--fifa-green); color: white; }
        .sticker.repeat { border-color: var(--fifa-gold); background: #fffde7; }

        /* Formulario */
        .form-group { margin-top: 2rem; background: #f9f9f9; padding: 1.5rem; border-radius: 12px; border: 1px dashed var(--fifa-blue); }
        textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; margin: 10px 0; font-family: inherit; }
        .btn { width: 100%; padding: 12px; background: var(--fifa-blue); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <header><div class="brand">FIFA WORLD CUP 2026™</div></header>
    
    <nav>
        <button onclick="showSection('album')" id="btn-album" class="active">Mi Álbum</button>
        <button onclick="showSection('tienda')" id="btn-tienda">Tienda Q</button>
        <button onclick="showSection('servicio')" id="btn-servicio">Servicio de Estampas</button>
    </nav>

    <main id="content"></main>
</div>

<script>
    const state = {
        section: 'album',
        myCollection: JSON.parse(localStorage.getItem('wc26_coll')) || {}
    };

    function showSection(section) {
        state.section = section;
        render();
    }

    function toggleSticker(id) {
        const current = state.myCollection[id] || 0;
        state.myCollection[id] = (current + 1) % 3;
        localStorage.setItem('wc26_coll', JSON.stringify(state.myCollection));
        render();
    }

    function render() {
        const container = document.getElementById('content');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${state.section}`).classList.add('active');

        if(state.section === 'album') {
            container.innerHTML = `
                <h2>Mi Álbum Digital</h2>
                <p style="font-size:0.8rem; margin-bottom:1rem;">Toca para marcar: <br> Gris (Falta) | Verde (Tengo) | Amarillo (Repetida)</p>
                <div class="sticker-grid">
                    ${Array.from({length: 48}).map((_, i) => {
                        const id = i + 1;
                        const status = state.myCollection[id] || 0;
                        const cls = status === 1 ? 'have' : (status === 2 ? 'repeat' : '');
                        return `<div class="sticker ${cls}" onclick="toggleSticker(${id})">${id}</div>`;
                    }).join('')}
                </div>
            `;
        } 

        else if(state.section === 'tienda') {
            container.innerHTML = `
                <h2>Catálogo Oficial 2026</h2>
                <div class="shop-card">
                    <div class="shop-info">
                        <h4>Álbum Pasta Dura (Empastado)</h4>
                        <p class="price">Q150.00</p>
                        <small>Colección de lujo con acabados dorados.</small>
                    </div>
                </div>
                <div class="shop-card">
                    <div class="shop-info">
                        <h4>Álbum Pasta Suave (Normal)</h4>
                        <p class="price">Q30.00</p>
                        <small>La edición clásica para llevar a todos lados.</small>
                    </div>
                </div>
                <div class="shop-card">
                    <div class="shop-info">
                        <h4>Caja de Estampas (104 sobres)</h4>
                        <p class="price">Q975.00</p>
                        <small>Ideal para llenar tu álbum rápido.</small>
                    </div>
                </div>
                <div class="shop-card">
                    <div class="shop-info">
                        <h4>Sobre Individual (5 estampas)</h4>
                        <p class="price">Q10.00</p>
                    </div>
                </div>
            `;
        }

        else if(state.section === 'servicio') {
            container.innerHTML = `
                <h2>¿Buscas Estampas Específicas?</h2>
                <p style="font-size:0.9rem;">Verificamos disponibilidad en nuestro stock de repetidas.</p>
                <div class="form-group">
                    <label>Escribe los números que necesitas:</label>
                    <textarea id="needed" rows="4" placeholder="Ej: 10, 45, 120, MEX-1..."></textarea>
                    <label>Tu número de WhatsApp:</label>
                    <input type="text" id="contact" style="width:100%; padding:10px; margin:10px 0; border:1px solid #ddd;">
                    <button class="btn" onclick="enviarInfo()">Consultar con Asesor</button>
                </div>
                <p style="font-size:0.7rem; margin-top:1rem; text-align:center;">Un asesor verificará nuestro inventario y te contactará en breve.</p>
            `;
        }
    }

    window.enviarInfo = () => {
        const lista = document.getElementById('needed').value;
        if(!lista) return alert("Por favor escribe qué estampas necesitas");
        alert("Tu solicitud ha sido enviada. El asesor 2026 verificará el stock de las estampas: " + lista);
    };

    render();
</script>
</body>
</html>
