<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Panini 2026 - Selección</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/2026_FIFA_World_Cup_Logo.svg/256px-2026_FIFA_World_Cup_Logo.svg.png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-green: #004d3d;
            --world-cup-blue: #001b3a;
            --world-cup-purple: #4a148c;
            --world-cup-yellow: #ffeb3b;
            --instagram-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: radial-gradient(circle at top right, var(--world-cup-purple), var(--world-cup-blue));
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* INTRO ANIMATION */
        #intro-space {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
            z-index: 3000; display: flex; align-items: center; justify-content: center;
            overflow: hidden; pointer-events: none; transition: opacity 2s ease, visibility 2s;
        }
        .star-field { position: absolute; background: white; border-radius: 50%; opacity: 0; animation: zoomStar 4s infinite ease-in; }
        @keyframes zoomStar { 0% { transform: scale(0) translate(0, 0); opacity: 0; } 20% { opacity: 0.8; } 100% { transform: scale(1.5) translate(var(--x), var(--y)); opacity: 0; } }
        .earth-intro { width: 150px; height: 150px; background: url('https://upload.wikimedia.org/wikipedia/commons/2/22/Earth_Western_Hemisphere_transparent_background.png'); background-size: cover; filter: drop-shadow(0 0 30px rgba(0, 140, 255, 0.4)); animation: approachEarth 5s forwards ease-in-out; z-index: 3001; }
        @keyframes approachEarth { 0% { transform: scale(0.05) rotate(0deg); opacity: 0; filter: brightness(0.5) blur(2px); } 30% { opacity: 1; filter: brightness(1) blur(0px); } 100% { transform: scale(25) rotate(15deg); opacity: 0; } }

        /* AUTH SCREEN */
        .auth-container { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80');
            background-size: cover; position: fixed; width: 100%; top: 0; z-index: 2000;
        }
        .auth-card { background: rgba(255, 255, 255, 0.1); padding: 3rem; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); text-align: center; backdrop-filter: blur(20px); width: 90%; max-width: 400px; animation: fadeInLogin 1s ease forwards; animation-delay: 3.5s; opacity: 0; }
        @keyframes fadeInLogin { to { opacity: 1; } }
        .google-btn { background: white; color: #333; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: 700; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px; }

        /* INTERFACE */
        #app { display: none; }
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1100; cursor: pointer; background: var(--world-cup-yellow); color: black; padding: 12px 18px; border-radius: 12px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1050; display: none; }
        #menu-overlay.active { display: block; }

        .contact-buttons { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .float-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); text-decoration: none; }
        .wa-color { background-color: #25d366; }
        .ig-color { background: var(--instagram-gradient); }
        
        nav {
            position: fixed; top: 0; left: -320px; width: 280px; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(25px);
            z-index: 1100; padding-top: 40px; border-right: 2px solid var(--world-cup-yellow);
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        nav.active { left: 0; }
        nav a { 
            display: block; padding: 12px 25px; color: white; text-decoration: none; 
            font-family: 'Oswald'; border-bottom: 1px solid rgba(255,255,255,0.05); 
            font-size: 0.9rem; letter-spacing: 0.5px;
        }
        nav a:hover { background: rgba(255, 235, 59, 0.1); color: var(--world-cup-yellow); padding-left: 35px; }

        .user-profile-mini { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 10px; }
        .profile-img-container { width: 70px; height: 70px; margin: 0 auto 10px; position: relative; }
        #nav-user-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--world-cup-yellow); }

        .view { display: none; max-width: 1100px; margin: 90px auto 20px auto; padding: 0 20px; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        
        /* SELECTION SYSTEM STYLES */
        .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 12px; margin-top: 15px; }
        .sticker { 
            aspect-ratio: 2/3; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            border-radius: 8px; display: flex; align-items: center; justify-content: center; 
            font-size: 0.9rem; cursor: pointer; position: relative; font-weight: bold;
            overflow: hidden;
        }
        .sticker:hover { transform: translateY(-5px); border-color: var(--world-cup-yellow); background: rgba(255, 235, 59, 0.05); }
        .sticker.selected { 
            background: var(--world-cup-yellow); color: black; font-weight: 900; border: none;
            box-shadow: 0 0 15px var(--world-cup-yellow);
            animation: selectPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes selectPop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

        .buy-btn { background: var(--world-cup-yellow); color: black; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-family: 'Oswald'; text-transform: uppercase; font-weight: 900; }
        .buy-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

        /* FLOATING ACTION FOOTER */
        .selection-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(15px); padding: 15px 20px; display: flex; justify-content: center;
            border-top: 2px solid var(--world-cup-yellow); transform: translateY(100%);
            transition: transform 0.4s ease; z-index: 1000;
        }
        .selection-footer.visible { transform: translateY(0); }

        #toast-container { position: fixed; bottom: 85px; right: 20px; z-index: 10000; display: flex; flex-direction: column; align-items: flex-end; pointer-events: none; }
        .toast { background: white; color: black; padding: 12px 20px; border-radius: 10px; font-family: 'Oswald'; margin-top: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: toastIn 0.4s forwards; }

        .music-player {
            position: fixed; bottom: 20px; left: 20px; z-index: 1000;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            padding: 10px 15px; border-radius: 50px; display: flex; align-items: center;
            gap: 12px; border: 1px solid var(--world-cup-yellow);
        }
        .music-btn { background: none; border: none; color: white; cursor: pointer; font-size: 1.1rem; }
        .logout-btn { background: rgba(255, 82, 82, 0.1) !important; color: #ff5252 !important; border: 1px solid #ff5252 !important; margin: 10px 25px !important; text-align: center; }
    </style>
</head>
<body onclick="enableAudio()">

    <div class="music-player">
        <button class="music-btn" id="playPause">▶</button>
        <div class="music-info" style="font-family:'Oswald'; font-size:0.65rem; color:var(--world-cup-yellow);">
            <span id="songTitle">We Are One</span>
        </div>
        <audio id="audioElement" loop src="we-are-one.mp3.mp3"></audio>
    </div>

    <div id="intro-space">
        <div class="earth-intro"></div>
    </div>

    <div id="toast-container"></div>
    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <h1 style="font-family:'Oswald'; color:var(--world-cup-yellow); font-size: 2.5rem;">PANINI 2026</h1>
            <button class="google-btn" id="loginBtn" onclick="loginWithGoogle()" style="display: none;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Entrar con Google
            </button>
        </div>
    </div>

    <div id="app">
        <div class="menu-toggle" onclick="toggleMenu()">☰ MENU</div>
        
        <div class="contact-buttons">
            <a href="https://wa.me/50246199644" target="_blank" class="float-btn wa-color"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="30"></a>
        </div>

        <nav id="sidebar">
            <div class="user-profile-mini">
                <div class="profile-img-container"><img id="nav-user-img" src=""></div>
                <div id="nav-user-name" style="font-family:'Oswald'; color:var(--world-cup-yellow);">Usuario</div>
            </div>
            <a href="#" onclick="showView('album-view')">📋 CARTAS QUE QUIERO SOLICITAR</a>
            <a href="#" onclick="showView('profile-view')">🧑 MI PERFIL</a>
            <a href="#" onclick="showView('history-view')">📜 MIS PEDIDOS</a>
            <a href="#" onclick="showView('prices-view')">💰 LISTA DE PRECIOS</a>
            <a href="#" onclick="handleLogout()" class="logout-btn">🚪 CERRAR SESIÓN</a>
        </nav>

        <!-- CARTAS QUE QUIERO SOLICITAR -->
        <div id="album-view" class="view active">
            <div class="card" style="border-left: 5px solid var(--world-cup-yellow);">
                <h2 style="font-family:'Oswald'; letter-spacing: 1px;">CARTAS QUE QUIERO SOLICITAR</h2>
                <p style="font-size: 0.8rem; color: rgba(255,255,255,0.6);">Selecciona las cartas que necesitas y presiona el botón de pedido.</p>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div class="card">
                    <h3 id="grp-name" style="font-family:'Oswald'; color:var(--world-cup-yellow);">GRUPO A</h3>
                    <div id="team-list" style="margin-top:15px;"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                        <button onclick="changeGroup(-1)" class="buy-btn" style="background:rgba(255,255,255,0.1); color:white;">◄</button>
                        <button onclick="changeGroup(1)" class="buy-btn">►</button>
                    </div>
                </div>
                <div class="card">
                    <h2 id="current-team-title" style="font-family:'Oswald'; border-bottom: 2px solid var(--world-cup-yellow); text-transform: uppercase;">SELECCIONA PAÍS</h2>
                    <div class="sticker-grid" id="sticker-grid"></div>
                </div>
            </div>
        </div>

        <div id="profile-view" class="view">
            <div class="card" style="max-width:500px; margin:auto; text-align: center;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">MI PERFIL</h2>
                <img id="profile-full-img" src="" style="width:150px; height:150px; border-radius:50%; object-fit:cover; border: 4px solid var(--world-cup-yellow); margin: 20px 0;">
                <h3 id="profile-name-display" style="font-family:'Oswald';">Nombre</h3>
                <p id="profile-email-display" style="opacity: 0.6; margin-bottom: 20px;"></p>
                <input type="file" id="imageUpload" style="display: none;" onchange="handleImageUpload(event)">
                <button class="buy-btn" onclick="document.getElementById('imageUpload').click()">CAMBIAR FOTO</button>
            </div>
        </div>

        <div id="history-view" class="view">
            <div class="card" style="max-width:600px; margin:auto;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow); text-align:center;">MIS PEDIDOS</h2>
                <div id="history-list" style="margin-top:15px;"></div>
            </div>
        </div>

        <div id="prices-view" class="view">
             <div class="card" style="max-width:400px; margin:auto;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow); text-align:center;">PRECIOS</h2>
                <div id="dynamic-prices-container" style="line-height:2.5; margin-top:15px;"></div>
            </div>
        </div>
    </div>

    <!-- SELECTION FOOTER -->
    <div id="selection-footer" class="selection-footer">
        <button class="buy-btn" style="max-width: 400px;" onclick="sendWhatsAppOrder()">
            SOLICITAR <span id="selected-count">0</span> CARTAS POR WHATSAPP
        </button>
    </div>

<script>
    const WHATSAPP_NUMBER = "50246199644";
    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let selectedStickers = new Set();
    let currentIdx = 0;
    let activeTeam = "";

    const grupos = [
        {id: "A", paises: ["México", "Sudáfrica", "República de Corea", "República Checa"]},
        {id: "B", paises: ["Canadá", "Bosnia y Herzegovina", "Qatar", "Suiza"]},
        {id: "C", paises: ["Brasil", "Marruecos", "Haití", "Escocia"]},
        {id: "D", paises: ["Estados Unidos", "Paraguay", "Australia", "Türkiye"]},
        {id: "E", paises: ["Alemania", "Curazao", "Costa de Marfil", "Ecuador"]},
        {id: "F", paises: ["Países Bajos", "Japón", "Túnez", "Albania"]},
        {id: "G", paises: ["Bélgica", "Egipto", "Irán", "Nueva Zelanda"]},
        {id: "H", paises: ["España", "Uruguay", "Arabia Saudita", "Cabo Verde"]},
        {id: "I", paises: ["Francia", "Senegal", "Noruega", "Irak"]},
        {id: "J", paises: ["Argentina", "Austria", "Argelia", "Jordania"]},
        {id: "K", paises: ["Portugal", "Colombia", "Uzbekistán", "Jamaica"]},
        {id: "L", paises: ["Inglaterra", "Croacia", "Ghana", "Panamá"]}
    ];

    function startIntro() {
        const intro = document.getElementById('intro-space');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star-field';
            const size = Math.random() * 2 + 'px';
            star.style.width = size; star.style.height = size;
            star.style.left = '50%'; star.style.top = '50%';
            const angle = Math.random() * Math.PI * 2;
            const dist = 600 + Math.random() * 800;
            star.style.setProperty('--x', Math.cos(angle) * dist + 'px');
            star.style.setProperty('--y', Math.sin(angle) * dist + 'px');
            star.style.animationDelay = Math.random() * 4 + 's';
            intro.appendChild(star);
        }
        setTimeout(() => { intro.style.opacity = '0'; setTimeout(() => intro.style.visibility = 'hidden', 2000); }, 4500);
    }
    startIntro();

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('nav-user-name').innerText = user.displayName;
            document.getElementById('profile-name-display').innerText = user.displayName;
            document.getElementById('profile-email-display').innerText = user.email;
            
            const userImg = user.photoURL || 'https://www.gstatic.com/images/branding/product/2x/avatar_square_blue_120dp.png';
            document.getElementById('nav-user-img').src = userImg;
            document.getElementById('profile-full-img').src = userImg;
            
            renderGroup();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('loginBtn').style.display = 'block';
        }
    });

    function renderGroup() {
        const g = grupos[currentIdx];
        document.getElementById('grp-name').innerText = "GRUPO " + g.id;
        const list = document.getElementById('team-list'); list.innerHTML = "";
        g.paises.forEach(p => {
            const d = document.createElement('div');
            d.style.cssText = "padding:12px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); font-family:'Oswald'; display:flex; align-items:center;";
            d.onclick = () => { 
                activeTeam = p; 
                document.getElementById('current-team-title').innerText = p; 
                renderStickers(); 
            };
            d.innerHTML = `<img src="https://flagcdn.com/w40/${getIso(p)}.png" width="22" style="margin-right:12px; border-radius:3px"> ${p.toUpperCase()}`;
            list.appendChild(d);
        });
    }

    function renderStickers() {
        const grid = document.getElementById('sticker-grid'); grid.innerHTML = "";
        for(let i=1; i<=20; i++) {
            const id = `${activeTeam} #${i}`;
            const s = document.createElement('div');
            s.className = `sticker ${selectedStickers.has(id) ? 'selected' : ''}`;
            s.innerHTML = i;
            s.onclick = () => toggleSticker(id);
            grid.appendChild(s);
        }
    }

    function toggleSticker(id) {
        if(selectedStickers.has(id)) selectedStickers.delete(id);
        else selectedStickers.add(id);
        
        renderStickers();
        updateSelectionFooter();
    }

    function updateSelectionFooter() {
        const footer = document.getElementById('selection-footer');
        const countSpan = document.getElementById('selected-count');
        countSpan.innerText = selectedStickers.size;
        
        if(selectedStickers.size > 0) footer.classList.add('visible');
        else footer.classList.remove('visible');
    }

    function sendWhatsAppOrder() {
        if(selectedStickers.size === 0) return;
        
        const listaCartas = Array.from(selectedStickers).join('\n- ');
        const mensaje = `Hola, quiero solicitar estas cartas:\n- ${listaCartas}`;
        const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
        
        window.open(url, '_blank');
        
        // Guardar registro opcional en DB
        db.collection("pedidos").add({
            usuario: auth.currentUser.displayName,
            cartas: Array.from(selectedStickers),
            fecha: new Date()
        });
        
        showToast("Redirigiendo a WhatsApp...");
    }

    function changeGroup(dir) {
        currentIdx = (currentIdx + dir + grupos.length) % grupos.length;
        renderGroup();
    }

    function getIso(p) {
        const codes = { "México":"mx", "Sudáfrica":"za", "República de Corea":"kr", "República Checa":"cz", "Canadá":"ca", "Bosnia y Herzegovina":"ba", "Qatar":"qa", "Suiza":"ch", "Brasil":"br", "Marruecos":"ma", "Haití":"ht", "Escocia":"gb-sct", "Estados Unidos":"us", "Paraguay":"py", "Australia":"au", "Türkiye":"tr", "Alemania":"de", "Curazao":"cw", "Costa de Marfil":"ci", "Ecuador":"ec", "Países Bajos":"nl", "Japón":"jp", "Túnez":"tn", "Albania":"al", "Bélgica":"be", "Egipto":"eg", "Irán":"ir", "Nueva Zelanda":"nz", "España":"es", "Uruguay":"uy", "Arabia Saudita":"sa", "Cabo Verde":"cv", "Francia":"fr", "Senegal":"sn", "Noruega":"no", "Irak":"iq", "Argentina":"ar", "Austria":"at", "Argelia":"dz", "Jordania":"jo", "Portugal":"pt", "Colombia":"co", "Uzbekistán":"uz", "Jamaica":"jm", "Inglaterra":"gb-eng", "Croacia":"hr", "Ghana":"gh", "Panamá":"pa" };
        return codes[p] || "un";
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(window.innerWidth < 768) toggleMenu();
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('menu-overlay').classList.toggle('active');
    }

    function loginWithGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function handleLogout() { auth.signOut().then(() => location.reload()); }
    function showToast(m) {
        const t = document.createElement('div'); t.className = 'toast'; t.innerText = m;
        document.getElementById('toast-container').appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    // Music Logic
    const audio = document.getElementById('audioElement');
    const playBtn = document.getElementById('playPause');
    function enableAudio() { if(audio.paused) { audio.play(); playBtn.innerText = "⏸"; } }
    playBtn.onclick = (e) => {
        e.stopPropagation();
        if(audio.paused) { audio.play(); playBtn.innerText = "⏸"; }
        else { audio.pause(); playBtn.innerText = "▶"; }
    };
</script>
</body>
</html>
