<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÁLBUM DIGITAL 2026 | UPANA</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { --fifa-red: #8a0631; --fifa-blue: #021a35; --fifa-gold: #c6a15a; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Roboto', sans-serif; background: #121212; color: white; overflow: hidden; }

        /* Notificaciones Estéticas */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: rgba(0,0,0,0.9); color: white; padding: 12px 20px;
            border-bottom: 3px solid var(--fifa-gold); border-radius: 5px; margin-bottom: 10px;
            font-family: 'Oswald'; font-size: 0.9rem; animation: slideIn 0.4s ease forwards;
        }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Pantalla de Inicio */
        .auth-container { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
        #bg-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; filter: brightness(0.3); }
        
        .auth-card { 
            background: rgba(0,0,0,0.85); padding: 2.5rem; border-radius: 15px; border: 1px solid var(--fifa-gold); 
            width: 90%; max-width: 400px; text-align: center; backdrop-filter: blur(10px);
        }

        .btn-google {
            width: 100%; padding: 14px; border: none; border-radius: 5px; cursor: pointer;
            font-family: 'Oswald'; text-transform: uppercase; margin-top: 20px;
            background: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.3s; font-size: 1rem; font-weight: bold;
        }
        .btn-google:hover { background: #f1f1f1; transform: translateY(-2px); }

        /* App Principal */
        #app { display: none; min-height: 100vh; background: #f4f4f4; color: #333; flex-direction: column; }
        header { background: var(--fifa-blue); color: white; padding: 1rem; text-align: center; border-bottom: 4px solid var(--fifa-gold); position: relative; }
        
        .logout-btn { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: transparent; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }

        .album-layout { max-width: 1100px; margin: 20px auto; display: grid; grid-template-columns: 1fr 1.5fr; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; flex-grow: 1; }
        .sidebar { background: #f9f9f9; border-right: 1px solid #ddd; padding: 20px; }
        .team-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
        .sticker-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .sticker { aspect-ratio: 2/3; background: #eee; border: 1px solid #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: 900; cursor: pointer; }
        .sticker.owned { background: #008f4c !important; color: white; border-color: #004d2a; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="auth-container" id="auth-screen">
        <video autoplay muted loop id="bg-video">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-stadium-lights-shining-at-night-4248-large.mp4" type="video/mp4">
        </video>
        <div class="auth-card">
            <h1 style="font-family:'Oswald'; color:var(--fifa-gold); font-size: 2.5rem;">PANINI 2026</h1>
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Iniciar con Google
            </button>
        </div>
    </div>

    <div id="app">
        <header>
            <h1 style="font-family:'Oswald'">COLECCIÓN GUATEMALA</h1>
            <p id="user-display" style="font-size: 0.7rem; opacity: 0.8;"></p>
            <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
        </header>
        <div class="album-layout">
            <div class="sidebar">
                <div style="background:var(--fifa-red); color:white; padding:10px; font-family:'Oswald'; text-align:center; margin-bottom:10px;" id="grp-name">GRUPO A</div>
                <div id="team-list"></div>
                <div style="display:flex; justify-content:space-between; margin-top:15px;">
                    <button onclick="changeGroup(-1)" style="padding:10px; background:var(--fifa-gold); border:none; color:white; cursor:pointer;">◀</button>
                    <button onclick="changeGroup(1)" style="padding:10px; background:var(--fifa-gold); border:none; color:white; cursor:pointer;">▶</button>
                </div>
            </div>
            <div style="padding:30px;">
                <h2 id="current-team-title" style="font-family:'Oswald'; color:var(--fifa-blue);">SELECCIONA PAÍS</h2>
                <div class="sticker-grid" id="sticker-grid"></div>
            </div>
        </div>
    </div>

<script>
    // Tu Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    // Inicialización Estándar
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function msg(text) {
        const container = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerText = text;
        container.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    // FUNCIÓN DE LOGIN CORREGIDA
    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        
        // Esto fuerza a que se abra la ventana de Google
        auth.signInWithPopup(provider)
            .then((result) => {
                const user = result.user;
                // Crear espacio en base de datos si es nuevo
                db.collection("usuarios").doc(user.uid).get().then(doc => {
                    if(!doc.exists) {
                        db.collection("usuarios").doc(user.uid).set({ coleccion: [] });
                    }
                });
                msg("✅ ¡Bienvenido!");
            })
            .catch(error => {
                console.error("Detalle del error:", error.code);
                if(error.code === 'auth/operation-not-allowed') msg("❌ Error: Habilita Google en Firebase");
                else if(error.code === 'auth/auth-domain-config-required') msg("❌ Error: Configura el dominio en Firebase");
                else msg("❌ Error al iniciar sesión");
            });
    }

    function logout() {
        auth.signOut();
    }

    // Lógica del Álbum
    const grupos = [
        {id: "A", paises: ["México", "Sudáfrica", "Corea del Sur", "República Checa"]},
        {id: "B", paises: ["Canadá", "Bosnia y Herzegovina", "Qatar", "Suiza"]},
        {id: "C", paises: ["Brasil", "Marruecos", "Haití", "Escocia"]},
        {id: "D", paises: ["Estados Unidos", "Paraguay", "Australia", "Turquía"]},
        {id: "E", paises: ["Alemania", "Ecuador", "Costa de Marfil", "Curazao"]},
        {id: "F", paises: ["Países Bajos", "Japón", "Suecia", "Túnez"]},
        {id: "G", paises: ["Bélgica", "Egipto", "Irán", "Nueva Zelanda"]},
        {id: "H", paises: ["España", "Uruguay", "Cabo Verde", "Arabia Saudita"]},
        {id: "I", paises: ["Francia", "Senegal", "Noruega", "Irak"]},
        {id: "J", paises: ["Argentina", "Argelia", "Austria", "Jordania"]},
        {id: "K", paises: ["Portugal", "Colombia", "Uzbekistán", "R. D. del Congo"]},
        {id: "L", paises: ["Inglaterra", "Croacia", "Ghana", "Panamá"]}
    ];

    let currentGrpIdx = 0;
    let activeTeam = "";
    let myStickers = [];

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            document.getElementById('user-display').innerText = user.displayName;
            db.collection("usuarios").doc(user.uid).onSnapshot(doc => {
                if(doc.exists) {
                    myStickers = doc.data().coleccion || [];
                    if(activeTeam) renderStickers();
                }
            });
            renderGroup();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }
    });

    function renderGroup() {
        const g = grupos[currentGrpIdx];
        document.getElementById('grp-name').innerText = "GRUPO " + g.id;
        const list = document.getElementById('team-list');
        list.innerHTML = "";
        g.paises.forEach(p => {
            const d = document.createElement('div');
            d.className = 'team-item';
            d.onclick = () => { activeTeam = p; document.getElementById('current-team-title').innerText = p.toUpperCase(); renderStickers(); };
            d.innerHTML = `<img src="https://flagcdn.com/w40/${getIso(p)}.png" width="25"> <span style="font-family:'Oswald'; font-size:0.8rem;">${p.toUpperCase()}</span>`;
            list.appendChild(d);
        });
    }

    function renderStickers() {
        const grid = document.getElementById('sticker-grid');
        grid.innerHTML = "";
        for(let i=1; i<=20; i++) {
            const id = `${activeTeam}-${i}`;
            const owned = myStickers.includes(id);
            const s = document.createElement('div');
            s.className = `sticker ${owned ? 'owned' : ''}`;
            s.innerText = i;
            s.onclick = () => {
                const newCol = owned ? myStickers.filter(x => x !== id) : [...myStickers, id];
                db.collection("usuarios").doc(auth.currentUser.uid).update({ coleccion: newCol });
            };
            grid.appendChild(s);
        }
    }

    function changeGroup(n) { currentGrpIdx = (currentGrpIdx + n + grupos.length) % grupos.length; renderGroup(); }

    function getIso(name) {
        const codes = {"México":"mx", "Sudáfrica":"za", "Corea del Sur":"kr", "República Checa":"cz", "Canadá":"ca", "Bosnia y Herzegovina":"ba", "Qatar":"qa", "Suiza":"ch", "Brasil":"br", "Marruecos":"ma", "Haití":"ht", "Escocia":"gb-sct", "Estados Unidos":"us", "Paraguay":"py", "Australia":"au", "Turquía":"tr", "Alemania":"de", "Ecuador":"ec", "Costa de Marfil":"ci", "Curazao":"cw", "Países Bajos":"nl", "Japón":"jp", "Suecia":"se", "Túnez":"tn", "Bélgica":"be", "Egipto":"eg", "Irán":"ir", "Nueva Zelanda":"nz", "España":"es", "Uruguay":"uy", "Cabo Verde":"cv", "Arabia Saudita":"sa", "Francia":"fr", "Senegal":"sn", "Noruega":"no", "Irak":"iq", "Argentina":"ar", "Argelia":"dz", "Austria":"at", "Jordania":"jo", "Portugal":"pt", "Colombia":"co", "Uzbekistán":"uz", "R. D. del Congo":"cd", "Inglaterra":"gb-eng", "Croacia":"hr", "Ghana":"gh", "Panamá":"pa"};
        return codes[name] || "un";
    }
</script>
</body>
</html>
