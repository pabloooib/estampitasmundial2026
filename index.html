<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Panini 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --world-cup-purple: #4a148c; --world-cup-blue: #001b3a; --world-cup-yellow: #ffeb3b; }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        body { font-family: 'Roboto', sans-serif; background: radial-gradient(circle at top right, var(--world-cup-purple), var(--world-cup-blue)); color: white; min-height: 100vh; }
        
        /* LOGIN */
        .auth-container { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80'); background-size: cover; }
        .google-btn { background: white; color: #757575; border: none; padding: 12px; border-radius: 12px; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 500; }

        /* NAV */
        .menu-toggle { position: fixed; top: 20px; left: 20px; z-index: 1000; cursor: pointer; background: var(--world-cup-yellow); color: black; padding: 12px; border-radius: 12px; font-weight: 900; display: none; }
        nav { position: fixed; top: 0; left: -320px; width: 300px; height: 100%; background: rgba(0,0,0,0.95); z-index: 999; padding-top: 80px; border-right: 2px solid var(--world-cup-yellow); }
        nav.active { left: 0; }
        nav a { display: block; padding: 18px 30px; color: white; text-decoration: none; font-family: 'Oswald'; border-bottom: 1px solid rgba(255,255,255,0.1); }

        /* APP */
        #app { display: none; padding: 90px 20px 20px; }
        .view { display: none; max-width: 1000px; margin: 0 auto; }
        .view.active { display: block; }
        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        
        /* ESTRELLAS */
        .stars { display: flex; gap: 10px; font-size: 2rem; cursor: pointer; justify-content: center; margin: 20px 0; }
        .star { color: rgba(255,255,255,0.2); }
        .star.active { color: var(--world-cup-yellow); }
        
        .buy-btn { background: var(--world-cup-yellow); color: black; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-family: 'Oswald'; font-size: 1rem; margin-top: 10px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: none; background: rgba(255,255,255,0.1); color: white; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="toast-container" style="position:fixed; top:20px; right:20px; z-index:2000;"></div>
    <div class="menu-toggle" id="menuBtn" onclick="toggleMenu()">☰ MENU</div>
    
    <nav id="sidebar">
        <a href="#" onclick="showView('album-view')">📔 MI PROGRESO</a>
        <a href="#" onclick="showView('prices-view')">💰 LISTA DE PRECIOS</a>
        <a href="#" onclick="showView('feedback-view')">⭐ CALIFÍCANOS</a>
        <a href="#" onclick="auth.signOut()" style="color: #ff5252;">🚪 CERRAR SESIÓN</a>
    </nav>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card" style="text-align:center;">
            <h1 style="font-family:'Oswald'; color:var(--world-cup-yellow); font-size: 3rem;">PANINI 2026</h1>
            <button class="google-btn" onclick="auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Acceder con Google
            </button>
        </div>
    </div>

    <div id="app">
        <div id="prices-view" class="view">
            <div class="card">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow); text-align:center;">PRECIOS ACTUALIZADOS</h2>
                <div id="dynamic-prices" style="margin-top:20px; line-height:3;"></div>
            </div>
        </div>

        <div id="feedback-view" class="view" style="max-width:500px;">
            <div class="card" style="text-align:center;">
                <h2 style="font-family:'Oswald';">TU OPINIÓN IMPORTA</h2>
                <div class="stars" id="star-rating">
                    <span class="star" onclick="setRating(1)">★</span>
                    <span class="star" onclick="setRating(2)">★</span>
                    <span class="star" onclick="setRating(3)">★</span>
                    <span class="star" onclick="setRating(4)">★</span>
                    <span class="star" onclick="setRating(5)">★</span>
                </div>
                <textarea id="feedback-text" placeholder="¿Cómo podemos mejorar el álbum?"></textarea>
                <button class="buy-btn" onclick="sendFeedback()">ENVIAR MEJORA</button>
            </div>
        </div>
    </div>

<script>
    firebase.initializeApp({
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    });
    const auth = firebase.auth(), db = firebase.firestore();

    let userRating = 0;
    function setRating(n) {
        userRating = n;
        document.querySelectorAll('.star').forEach((s, i) => s.classList.toggle('active', i < n));
    }

    async function sendFeedback() {
        const text = document.getElementById('feedback-text').value;
        if(userRating === 0) return alert("Por favor califica con estrellas");
        await db.collection("mejoras").add({
            user: auth.currentUser.displayName,
            rating: userRating,
            comment: text,
            date: new Date().toLocaleString()
        });
        alert("¡Gracias por tu sugerencia!");
        showView('prices-view');
    }

    // Escuchar precios del Admin
    db.collection("config").doc("precios").onSnapshot(doc => {
        if(doc.exists) {
            const data = doc.data();
            document.getElementById('dynamic-prices').innerHTML = Object.entries(data).map(([item, price]) => `
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.1);">
                    <span>${item}</span> <b>Q ${price}</b>
                </div>`).join('');
        }
    });

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(window.innerWidth < 900) toggleMenu();
    }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    auth.onAuthStateChanged(user => {
        document.getElementById('auth-screen').style.display = user ? 'none' : 'flex';
        document.getElementById('app').style.display = user ? 'block' : 'none';
        document.getElementById('menuBtn').style.display = user ? 'block' : 'none';
        if(user) showView('prices-view');
    });
</script>
</body>
</html>
