<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOUVREIGN | Panini Digital 2026</title>
    
    <link rel="icon" type="image/jpeg" href="imagenmundial.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-yellow: #ffeb3b;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --premium-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: radial-gradient(circle at top right, #1a0a2e, #001b3a, #000);
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar-top {
            position: fixed; top: 0; width: 100%; height: 70px;
            background: rgba(0, 5, 15, 0.85); backdrop-filter: blur(20px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 25px; z-index: 1500; border-bottom: 1px solid var(--glass-border);
        }

        .menu-toggle { cursor: pointer; display: flex; flex-direction: column; gap: 6px; z-index: 1600; }
        .bar { width: 28px; height: 3px; background: var(--world-cup-yellow); transition: 0.4s; border-radius: 2px; }
        .menu-active .bar:nth-child(1) { transform: translateY(9px) rotate(45deg); }
        .menu-active .bar:nth-child(2) { opacity: 0; }
        .menu-active .bar:nth-child(3) { transform: translateY(-9px) rotate(-45deg); }

        /* --- NAV / SIDEBAR --- */
        nav {
            position: fixed; top: 0; left: -100%; width: 300px; height: 100vh;
            background: rgba(0, 8, 20, 0.98); backdrop-filter: blur(40px);
            z-index: 1550; padding: 100px 0; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            border-right: 1px solid var(--glass-border);
        }
        nav.active { left: 0; }

        .nav-link {
            padding: 18px 35px; color: rgba(255,255,255,0.7); text-decoration: none;
            font-family: 'Oswald'; display: flex; align-items: center; gap: 15px;
            font-size: 1.1rem; transition: 0.3s; position: relative;
        }
        .nav-link:hover, .nav-link.active-sec { color: var(--world-cup-yellow); background: rgba(255,235,59,0.05); }
        .nav-link.active-sec::before {
            content: ''; position: absolute; left: 0; height: 60%; width: 4px; 
            background: var(--world-cup-yellow); box-shadow: 0 0 15px var(--world-cup-yellow);
        }

        /* --- LISTADO POR GRUPOS Y BANDERAS --- */
        .group-container { margin-bottom: 40px; animation: fadeIn 0.5s ease; }
        .country-header {
            display: flex; align-items: center; gap: 15px; margin: 20px 0;
            padding: 10px; background: var(--glass); border-radius: 10px;
        }
        .flag-icon { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        .country-name { font-family: 'Oswald'; font-size: 1.4rem; letter-spacing: 1px; color: var(--world-cup-yellow); }

        .stickers-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 12px;
        }
        .sticker {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 15px 5px; border-radius: 8px; text-align: center;
            font-family: 'Oswald'; cursor: pointer; transition: 0.2s;
        }
        .sticker.selected { background: var(--world-cup-yellow); color: #000; font-weight: 900; transform: scale(1.05); }

        /* --- CARTAS EXTRA PREMIUM --- */
        .extra-card-container {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px; margin-top: 20px;
        }
        .extra-card {
            background: var(--glass); border-radius: 20px; overflow: hidden;
            border: 1px solid var(--glass-border); position: relative;
            cursor: pointer; transition: 0.4s; aspect-ratio: 3/4.5;
        }
        .extra-card:hover { transform: translateY(-10px); border-color: var(--world-cup-yellow); }
        .extra-card img { width: 100%; height: 100%; object-fit: cover; }
        .extra-card.selected { border: 3px solid var(--world-cup-yellow); box-shadow: 0 0 25px rgba(255,235,59,0.4); }
        
        .card-label {
            position: absolute; bottom: 0; width: 100%; padding: 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }

        /* --- INSTAGRAM --- */
        .insta-float {
            position: fixed; right: 20px; bottom: 20px; z-index: 1400;
            background: linear-gradient(45deg, #f09433, #e54050, #962fbf, #4f5bd5);
            width: 50px; height: 50px; border-radius: 14px; display: flex;
            align-items: center; justify-content: center; transition: 0.3s;
        }
        .insta-float:hover { transform: scale(1.1) rotate(5deg); }
        .insta-float svg { fill: white; width: 25px; }

        /* --- UI UTILS --- */
        .view { display: none; padding: 100px 20px 80px; max-width: 1100px; margin: auto; }
        .view.active { display: block; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1520; display: none; }
        .overlay.active { display: block; }

        .footer-action {
            position: fixed; bottom: 0; width: 100%; padding: 20px;
            background: rgba(0,8,20,0.95); backdrop-filter: blur(15px);
            border-top: 1px solid var(--world-cup-yellow); transform: translateY(100%);
            transition: 0.4s; z-index: 1000; display: flex; justify-content: center;
        }
        .footer-action.visible { transform: translateY(0); }
        .btn-order { background: var(--world-cup-yellow); color: #000; border: none; padding: 15px 50px; border-radius: 10px; font-family: 'Oswald'; font-weight: 700; width: 100%; max-width: 400px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .stickers-grid { grid-template-columns: repeat(4, 1fr); }
            nav { width: 85%; }
        }
    </style>
</head>
<body>

    <header class="navbar-top">
        <div class="menu-toggle" onclick="toggleMenu()" id="menuBtn">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <img src="panini" alt="Panini" style="height: 35px;">
        <div style="width: 48px;"></div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <nav id="sidebar">
        <!-- Perfil primero en el menú como estaba originalmente -->
        <a href="#" class="nav-link" onclick="showView('profile-view', this)"><span>🧑</span> MI PERFIL</a>
        <a href="#" class="nav-link active-sec" onclick="showView('album-view', this)"><span>📋</span> LISTADO DE CARTAS</a>
        <a href="#" class="nav-link" onclick="showView('extras-view', this)"><span>🌟</span> CARTAS EXTRA</a>
        <div style="margin-top: 50px; padding: 0 35px;">
            <button onclick="handleLogout()" style="width:100%; padding:12px; background:transparent; border:1px solid #ff5252; color:#ff5252; border-radius:8px; font-family:'Oswald';">CERRAR SESIÓN</button>
        </div>
    </nav>

    <a href="https://instagram.com/pablooib" target="_blank" class="insta-float">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.266.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.267-.07-1.646-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.058-1.69-.072-4.949-.072zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.791-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.209-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
    </a>

    <main>
        <!-- VISTA PERFIL (RESTAURADA) -->
        <div id="profile-view" class="view">
            <h1 style="font-family:'Oswald'; font-size: 2rem;">MI PERFIL</h1>
            <div style="background:var(--glass); padding:30px; border-radius:20px; margin-top:20px; border:1px solid var(--glass-border);">
                <p id="profile-name" style="font-size:1.2rem; font-weight:700;">Cargando usuario...</p>
                <p id="profile-email" style="opacity:0.6;"></p>
            </div>
        </div>

        <!-- VISTA ÁLBUM (GRUPOS Y BANDERAS RESTAURADOS) -->
        <div id="album-view" class="view active">
            <div id="groups-root"></div>
        </div>

        <!-- VISTA EXTRAS (CORREGIDA IMÁGENES) -->
        <div id="extras-view" class="view">
            <h1 style="font-family:'Oswald'; margin-bottom:20px;">EDICIÓN ESPECIAL</h1>
            <div class="extra-card-container">
                <div class="extra-card" onclick="toggleSelection(this, 'MESSI LEGEND')">
                    <img src="imagenmessi" alt="Messi">
                    <div class="card-label"><h3>MESSI GOLD</h3></div>
                </div>
                <div class="extra-card" onclick="toggleSelection(this, 'CR7 WORLD CUP')">
                    <img src="imagencristianomundial" alt="Cristiano">
                    <div class="card-label"><h3>CR7 LEGACY</h3></div>
                </div>
                <div class="extra-card" onclick="toggleSelection(this, 'LOGO PANINI')">
                    <img src="panini" alt="Panini" style="object-fit: contain; padding:40px; background:white;">
                    <div class="card-label"><h3 style="color:#000">AUTHENTIC LOGO</h3></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-order" class="footer-action">
        <button class="btn-order" onclick="sendWhatsApp()">SOLICITAR SELECCIONADAS (<span id="total-count">0</span>)</button>
    </div>

    <script>
        // CONFIGURACIÓN DE PAÍSES Y GRUPOS
        const DATA = [
            { group: 'GRUPO A', country: 'ARGENTINA', flag: 'https://flagcdn.com/ar.svg', stickers: 19 },
            { group: 'GRUPO A', country: 'MÉXICO', flag: 'https://flagcdn.com/mx.svg', stickers: 19 },
            { group: 'GRUPO B', country: 'PORTUGAL', flag: 'https://flagcdn.com/pt.svg', stickers: 19 },
            { group: 'GRUPO B', country: 'ESPAÑA', flag: 'https://flagcdn.com/es.svg', stickers: 19 },
            { group: 'GRUPO C', country: 'BRASIL', flag: 'https://flagcdn.com/br.svg', stickers: 19 },
            { group: 'GRUPO C', country: 'ALEMANIA', flag: 'https://flagcdn.com/de.svg', stickers: 19 }
        ];

        let selection = new Set();

        function initAlbum() {
            const root = document.getElementById('groups-root');
            let currentGroup = '';

            DATA.forEach(item => {
                if(item.group !== currentGroup) {
                    currentGroup = item.group;
                    const gTitle = document.createElement('h2');
                    gTitle.style = "font-family:'Oswald'; margin: 40px 0 10px; color:rgba(255,255,255,0.4); font-size:1rem;";
                    gTitle.innerText = currentGroup;
                    root.appendChild(gTitle);
                }

                const container = document.createElement('div');
                container.className = 'group-container';
                container.innerHTML = `
                    <div class="country-header">
                        <img src="${item.flag}" class="flag-icon">
                        <span class="country-name">${item.country}</span>
                    </div>
                    <div class="stickers-grid">
                        ${Array.from({length: item.stickers}, (_, i) => `
                            <div class="sticker" onclick="toggleSelection(this, '${item.country} ${i+1}')">
                                ${i+1}
                            </div>
                        `).join('')}
                    </div>
                `;
                root.appendChild(container);
            });
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('menuBtn').classList.toggle('menu-active');
        }

        function showView(id, link) {
            if(window.innerWidth < 768) toggleMenu();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-sec'));
            link.classList.add('active-sec');
        }

        function toggleSelection(el, id) {
            el.classList.toggle('selected');
            if(selection.has(id)) selection.delete(id);
            else selection.add(id);
            
            document.getElementById('total-count').innerText = selection.size;
            document.getElementById('footer-order').classList.toggle('visible', selection.size > 0);
            if(navigator.vibrate) navigator.vibrate(10);
        }

        function sendWhatsApp() {
            const list = Array.from(selection).join(', ');
            const url = `https://wa.me/50246199644?text=${encodeURIComponent("Hola! Quiero estas cartas: " + list)}`;
            window.open(url, '_blank');
        }

        function handleLogout() {
            firebase.auth().signOut().then(() => location.reload());
        }

        // Simulación de Auth
        document.addEventListener('DOMContentLoaded', () => {
            initAlbum();
            firebase.auth().onAuthStateChanged(user => {
                if(user) {
                    document.getElementById('profile-name').innerText = user.displayName || "Usuario Panini";
                    document.getElementById('profile-email').innerText = user.email;
                }
            });
        });
    </script>
</body>
</html>
