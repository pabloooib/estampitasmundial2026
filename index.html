<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Panini 2026</title>
    
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/4/43/2026_FIFA_World_Cup_Logo.svg">
    
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-green: #004d3d;
            --world-cup-blue: #001b3a;
            --world-cup-purple: #4a148c;
            --world-cup-yellow: #ffeb3b;
            --instagram-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: radial-gradient(circle at top right, var(--world-cup-purple), var(--world-cup-blue));
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- LOGIN --- */
        .auth-container { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80');
            background-size: cover; position: fixed; width: 100%; top: 0; z-index: 2000;
        }
        .auth-card { 
            background: rgba(255, 255, 255, 0.1); padding: 3rem; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); text-align: center; backdrop-filter: blur(20px);
            width: 90%; max-width: 400px;
        }

        /* ESTILO PARA EL LOGO DE LA COPA */
        .world-cup-logo {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            padding: 10px;
            margin: 0 auto 20px auto;
            box-shadow: 0 0 20px rgba(255, 235, 59, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .google-btn {
            background: white; color: #333; border: none; padding: 14px;
            border-radius: 12px; cursor: pointer; width: 100%; font-weight: 700;
            margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* --- APP CONTAINER --- */
        #app { display: none; }

        .menu-toggle { 
            position: fixed; top: 20px; left: 20px; z-index: 1100; cursor: pointer; 
            background: var(--world-cup-yellow); color: black; padding: 12px 18px; 
            border-radius: 12px; font-weight: 900; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #menu-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1050; display: none;
        }
        #menu-overlay.active { display: block; }

        .contact-buttons { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .float-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); text-decoration: none; }
        .wa-color { background-color: #25d366; }
        .ig-color { background: var(--instagram-gradient); }
        
        nav {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(25px);
            z-index: 1100; padding-top: 80px; border-right: 2px solid var(--world-cup-yellow);
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
        }
        nav.active { left: 0; }
        nav a { display: block; padding: 18px 30px; color: white; text-decoration: none; font-family: 'Oswald'; border-bottom: 1px solid rgba(255,255,255,0.05); }
        nav a:hover { background: rgba(255, 235, 59, 0.1); color: var(--world-cup-yellow); }

        .view { display: none; max-width: 1100px; margin: 90px auto 20px auto; padding: 0 20px; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; margin-top: 15px; }
        .sticker { aspect-ratio: 2/3; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; }
        .sticker.owned { background: var(--world-cup-yellow); color: black; font-weight: 900; border: none; }
        .buy-btn { background: var(--world-cup-yellow); color: black; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-family: 'Oswald'; text-transform: uppercase; }
        
        #toast-container { position: fixed; bottom: 85px; right: 20px; z-index: 10000; }
        .toast { background: white; color: black; padding: 12px 20px; border-radius: 10px; font-family: 'Oswald'; margin-top: 5px; }
        .star { cursor: pointer; font-size: 2.5rem; transition: color 0.2s; }
        .star.active { color: var(--world-cup-yellow); }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <div class="world-cup-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/43/2026_FIFA_World_Cup_Logo.svg" width="60" alt="Logo WC 2026">
            </div>
            <h1 style="font-family:'Oswald'; color:var(--world-cup-yellow); font-size: 2.5rem;">PANINI 2026</h1>
            <p id="auth-status" style="margin-top: 10px; font-size: 0.9rem;">Cargando sistema...</p>
            <button class="google-btn" id="loginBtn" onclick="loginWithGoogle()" style="display: none;">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Entrar con Google
            </button>
        </div>
    </div>

    <div id="app">
        <div class="menu-toggle" onclick="toggleMenu()">☰ MENU</div>
        
        <div class="contact-buttons">
            <a href="https://www.instagram.com/pablooib" target="_blank" class="float-btn ig-color"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" width="30"></a>
            <a href="https://wa.me/50246199644" target="_blank" class="float-btn wa-color"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="30"></a>
        </div>

        <nav id="sidebar">
            <div style="padding: 20px; text-align: center;"><h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">PANINI 2026</h2></div>
            <a href="#" onclick="showView('album-view')">📔 MI PROGRESO</a>
            <a href="#" onclick="showView('special-card-view')">⭐ CARTA ESPECIAL</a>
            <a href="#" onclick="showView('stock-view')">💎 CARTAS EN STOCK</a>
            <a href="#" onclick="showView('shop-view')">🛒 TIENDA</a>
            <a href="#" onclick="showView('prices-view')">💰 LISTA DE PRECIOS</a>
            <a href="#" onclick="showView('rating-view')">🌟 CALIFÍCANOS</a>
            <a href="#" onclick="handleLogout()" style="color: #ff5252; margin-top: 20px;">🚪 CERRAR SESIÓN</a>
        </nav>

        <div id="album-view" class="view active">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                <div class="card">
                    <h3 id="grp-name" style="font-family:'Oswald'; color:var(--world-cup-yellow);">GRUPO A</h3>
                    <div id="team-list" style="margin-top:15px;"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                        <button onclick="changeGroup(-1)" class="buy-btn" style="background:rgba(255,255,255,0.1); color:white;">◄</button>
                        <button onclick="changeGroup(1)" class="buy-btn">►</button>
                    </div>
                </div>
                <div class="card">
                    <h2 id="current-team-title" style="font-family:'Oswald'; border-bottom: 2px solid var(--world-cup-yellow);">SELECCIONA PAÍS</h2>
                    <div class="sticker-grid" id="sticker-grid"></div>
                </div>
            </div>
        </div>

        <div id="special-card-view" class="view">
            <div class="card" style="max-width:500px; margin:auto;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">SOLICITAR CARTA</h2>
                <input type="text" id="playerName" placeholder="Nombre del Jugador" style="width:100%; padding:12px; margin:10px 0; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:white;">
                <input type="text" id="playerTeam" placeholder="Selección" style="width:100%; padding:12px; margin-bottom:15px; border-radius:8px; border:none; background:rgba(255,255,255,0.1); color:white;">
                <button class="buy-btn" onclick="sendOrder('Carta Especial', 'A convenir')">CONSULTAR WHATSAPP</button>
            </div>
        </div>

        <div id="stock-view" class="view">
            <div class="card" style="max-width:600px; margin:auto;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow); text-align:center;">EN STOCK</h2>
                <div id="stock-list-container" style="margin-top:15px;"></div>
            </div>
        </div>

        <div id="shop-view" class="view">
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:20px;">
                <div class="card" style="text-align:center; background:white; color:black;">
                    <h3 style="font-family:'Oswald';">ALBUM PASTA DURA</h3>
                    <p style="font-size:1.5rem; font-weight:900; margin:10px 0;">Q 125.00</p>
                    <button class="buy-btn" style="background:#4a148c; color:white;" onclick="sendOrder('Album Pasta Dura', '125.00')">COMPRAR</button>
                </div>
                <div class="card" style="text-align:center; background:white; color:black;">
                    <h3 style="font-family:'Oswald';">ALBUM NORMAL</h3>
                    <p style="font-size:1.5rem; font-weight:900; margin:10px 0;">Q 35.00</p>
                    <button class="buy-btn" style="background:#004d3d; color:white;" onclick="sendOrder('Album Normal', '35.00')">COMPRAR</button>
                </div>
            </div>
        </div>

        <div id="prices-view" class="view">
             <div class="card" style="max-width:400px; margin:auto;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow); text-align:center;">PRECIOS</h2>
                <div id="dynamic-prices-container" style="line-height:2.5; margin-top:15px;"></div>
            </div>
        </div>

        <div id="rating-view" class="view">
            <div class="card" style="text-align:center; max-width:400px; margin:auto;">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">CALIFÍCANOS</h2>
                <div id="stars" style="font-size:2.5rem; margin:15px 0;">
                    <span class="star" onclick="setRate(1)">☆</span>
                    <span class="star" onclick="setRate(2)">☆</span>
                    <span class="star" onclick="setRate(3)">☆</span>
                    <span class="star" onclick="setRate(4)">☆</span>
                    <span class="star" onclick="setRate(5)">☆</span>
                </div>
                <button class="buy-btn" onclick="submitRating()">ENVIAR RESEÑA</button>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        const authScreen = document.getElementById('auth-screen');
        const app = document.getElementById('app');
        if(user) {
            authScreen.style.display = 'none';
            app.style.display = 'block';
            initApp(user);
        } else {
            authScreen.style.display = 'flex';
            app.style.display = 'none';
            document.getElementById('loginBtn').style.display = 'block';
            document.getElementById('auth-status').innerText = "Inicia sesión para entrar al álbum";
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function handleLogout() {
        auth.signOut().then(() => window.location.reload());
    }

    function toggleMenu() { 
        document.getElementById('sidebar').classList.toggle('active'); 
        document.getElementById('menu-overlay').classList.toggle('active');
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        toggleMenu(); 
    }

    let userRating = 0;
    function setRate(n) {
        userRating = n;
        const stars = document.querySelectorAll('.star');
        stars.forEach((s, i) => {
            s.innerText = i < n ? '★' : '☆';
            s.classList.toggle('active', i < n);
        });
    }

    function submitRating() {
        if(userRating === 0) return alert("Por favor, selecciona una estrella antes de enviar.");
        alert("¡Gracias por tu calificación de " + userRating + " estrellas!");
        showView('album-view');
    }

    let myStickers = [];
    let activeTeam = "";
    let currentIdx = 0;
    const grupos = [
        {id: "A", paises: ["México", "Sudáfrica", "República de Corea", "República Checa"]},
        {id: "B", paises: ["Canadá", "Bosnia y Herzegovina", "Qatar", "Suiza"]},
        {id: "C", paises: ["Brasil", "Marruecos", "Haití", "Escocia"]},
        {id: "D", paises: ["Estados Unidos", "Paraguay", "Australia", "Türkiye"]},
        {id: "E", paises: ["Alemania", "Curazao", "Costa de Marfil", "Ecuador"]},
        {id: "F", paises: ["Países Bajos", "Japón", "Túnez", "Albania"]},
        {id: "G", paises: ["Bélgica", "Egipto", "Irán", "Nueva Zelanda"]},
        {id: "H", paises: ["España", "Uruguay", "Arabia Saudita", "Cabo Verde"]},
        {id: "I", paises: ["Francia", "Senegal", "Noruega", "Irak"]},
        {id: "J", paises: ["Argentina", "Austria", "Argelia", "Jordania"]},
        {id: "K", paises: ["Portugal", "Colombia", "Uzbekistán", "Jamaica"]},
        {id: "L", paises: ["Inglaterra", "Croacia", "Ghana", "Panamá"]}
    ];

    function initApp(user) {
        renderGroup();
        db.collection("usuarios").doc(user.uid).onSnapshot(doc => {
            if(doc.exists) { myStickers = doc.data().coleccion || []; if(activeTeam) renderStickers(); }
        });
        db.collection("especiales").onSnapshot(snap => {
            document.getElementById('stock-list-container').innerHTML = snap.docs.map(doc => `
                <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid rgba(255,255,255,0.1)">
                    <span>${doc.data().name}</span> <b style="color:var(--world-cup-yellow)">Q${doc.data().price}</b>
                </div>`).join('');
        });
    }

    function renderGroup() {
        const g = grupos[currentIdx];
        document.getElementById('grp-name').innerText = "GRUPO " + g.id;
        const list = document.getElementById('team-list'); list.innerHTML = "";
        g.paises.forEach(p => {
            const d = document.createElement('div');
            d.style.cssText = "padding:12px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); font-family:'Oswald';";
            d.onclick = () => { activeTeam = p; document.getElementById('current-team-title').innerText = p.toUpperCase(); renderStickers(); };
            d.innerHTML = `<img src="https://flagcdn.com/w40/${getIso(p)}.png" width="20" style="margin-right:10px"> ${p.toUpperCase()}`;
            list.appendChild(d);
        });
    }

    function renderStickers() {
        const grid = document.getElementById('sticker-grid'); grid.innerHTML = "";
        for(let i=1; i<=20; i++) {
            const id = `${activeTeam}-${i}`;
            const owned = myStickers.includes(id);
            const s = document.createElement('div');
            s.className = `sticker ${owned ? 'owned' : ''}`;
            s.innerText = i;
            s.onclick = () => {
                const newCol = owned ? myStickers.filter(x => x !== id) : [...myStickers, id];
                db.collection("usuarios").doc(auth.currentUser.uid).set({ coleccion: newCol }, {merge: true});
            };
            grid.appendChild(s);
        }
    }

    function getIso(p) {
        const codes = {
            "México":"mx", "Sudáfrica":"za", "República de Corea":"kr", "República Checa":"cz", 
            "Canadá":"ca", "Bosnia y Herzegovina":"ba", "Qatar":"qa", "Suiza":"ch", 
            "Brasil":"br", "Marruecos":"ma", "Haití":"ht", "Escocia":"gb-sct", 
            "Estados Unidos":"us", "Paraguay":"py", "Australia":"au", "Türkiye":"tr",
            "Alemania":"de", "Curazao":"cw", "Costa de Marfil":"ci", "Ecuador":"ec",
            "Países Bajos":"nl", "Japón":"jp", "Túnez":"tn", "Albania":"al",
            "Bélgica":"be", "Egipto":"eg", "Irán":"ir", "Nueva Zelanda":"nz",
            "España":"es", "Uruguay":"uy", "Arabia Saudita":"sa", "Cabo Verde":"cv",
            "Francia":"fr", "Senegal":"sn", "Noruega":"no", "Irak":"iq",
            "Argentina":"ar", "Austria":"at", "Argelia":"dz", "Jordania":"jo",
            "Portugal":"pt", "Colombia":"co", "Uzbekistán":"uz", "Jamaica":"jm",
            "Inglaterra":"gb-eng", "Croacia":"hr", "Ghana":"gh", "Panamá":"pa"
        };
        return codes[p] || "un";
    }

    async function sendOrder(t, p) {
        const id = "PN-" + Math.floor(1000 + Math.random()*9000);
        let msj = `¡Hola! 👋 Orden: *${t}*\nID: ${id}\nPrecio: Q${p}`;
        window.open(`https://wa.me/50246199644?text=${encodeURIComponent(msj)}`, '_blank');
    }

    function changeGroup(n) { currentIdx = (currentIdx + n + grupos.length) % grupos.length; renderGroup(); }
</script>
</body>
</html>
