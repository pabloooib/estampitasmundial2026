<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANINI 2026 </title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@300;400;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-firestore-compat.js"></script>

    <style>
        :root { 
            --world-cup-green: #004d3d;
            --world-cup-blue: #001b3a;
            --world-cup-purple: #4a148c;
            --world-cup-yellow: #ffeb3b;
            --instagram-gradient: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        
        body { 
            font-family: 'Roboto', sans-serif; 
            background: radial-gradient(circle at top right, var(--world-cup-purple), var(--world-cup-blue));
            color: white; min-height: 100vh; overflow-x: hidden;
        }

        /* --- LOGIN --- */
        .auth-container { 
            height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?auto=format&fit=crop&q=80');
            background-size: cover;
        }
        .auth-card { 
            background: rgba(255, 255, 255, 0.05); padding: 3rem; border-radius: 30px; 
            border: 1px solid rgba(255,255,255,0.2); text-align: center; backdrop-filter: blur(20px);
            width: 90%; max-width: 400px;
        }
        .btn-google { 
            width: 100%; padding: 15px; border: none; border-radius: 50px; cursor: pointer; 
            font-family: 'Oswald'; background: white; display: flex; align-items: center; 
            justify-content: center; gap: 15px; font-size: 1rem; margin-top: 20px;
        }

        /* --- MENÚ Y CONTACTO --- */
        .menu-toggle { 
            position: fixed; top: 20px; left: 20px; z-index: 1000; cursor: pointer; 
            background: var(--world-cup-yellow); color: black; padding: 12px 18px; 
            border-radius: 12px; font-weight: 900; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .contact-buttons { position: fixed; bottom: 20px; right: 20px; display: none; flex-direction: column; gap: 10px; z-index: 1000; }
        
        .float-btn { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.4); text-decoration: none; }
        .wa-color { background-color: #25d366; }
        .ig-color { background: var(--instagram-gradient); }
        .float-btn:hover { transform: scale(1.1) rotate(10deg); }
        
        nav {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px);
            z-index: 999; padding-top: 80px; border-right: 2px solid var(--world-cup-yellow);
        }
        nav.active { left: 0; }
        nav a { display: block; padding: 18px 30px; color: white; text-decoration: none; font-family: 'Oswald'; border-bottom: 1px solid rgba(255,255,255,0.05); }
        nav a:hover { background: var(--world-cup-yellow); color: black; padding-left: 40px; }

        /* --- CONTENIDO --- */
        #app { display: none; padding: 20px; padding-top: 90px; }
        .view { display: none; max-width: 1100px; margin: 0 auto; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: rgba(255,255,255,0.08); border-radius: 20px; padding: 25px; backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 900px) { .grid-layout { grid-template-columns: 320px 1fr; } }

        .sticker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; margin-top: 15px; }
        .sticker { aspect-ratio: 2/3; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; }
        .sticker.owned { background: var(--world-cup-yellow); color: black; font-weight: 900; transform: scale(1.05); box-shadow: 0 0 15px rgba(255,235,59,0.4); border: none; }

        .buy-btn { background: var(--world-cup-yellow); color: black; border: none; padding: 15px; border-radius: 12px; cursor: pointer; width: 100%; font-family: 'Oswald'; font-size: 1rem; margin-top: 15px; text-transform: uppercase; }
        .special-form input { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: none; background: white; color: #333; }

        #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10000; }
        .toast { background: white; color: black; padding: 12px 25px; border-radius: 50px; font-family: 'Oswald'; margin-top: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center; }
    </style>
</head>
<body>

    <div id="toast-container"></div>
    
    <div class="menu-toggle" id="menuBtn" onclick="toggleMenu()">☰ MENU</div>
    
    <div class="contact-buttons" id="contactGroup">
        <a href="https://www.instagram.com/pablooib" target="_blank" class="float-btn ig-color">
            <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" width="30">
        </a>
        <a href="https://wa.me/50246199644" target="_blank" class="float-btn wa-color">
            <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="30">
        </a>
    </div>

    <nav id="sidebar">
        <div style="padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
            <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">PANINI 2026</h2>
        </div>
        <a href="#" onclick="showView('album-view')">📔 MI PROGRESO</a>
        <a href="#" onclick="showView('special-card-view')">⭐ CARTA ESPECIAL</a>
        <a href="#" onclick="showView('shop-view')">🛒 COMPRAR ÁLBUM</a>
        <a href="https://www.instagram.com/pablooib" target="_blank" style="color:#ff85a1;">📸 INSTAGRAM (@pablooib)</a>
        <a href="#" onclick="handleLogout()" style="color: #ff5252; margin-top: 20px;">🚪 CERRAR SESIÓN</a>
    </nav>

    <div class="auth-container" id="auth-screen">
        <div class="auth-card">
            <h1 style="font-family:'Oswald'; color:var(--world-cup-yellow); font-size: 3.5rem;">2026</h1>
            <p style="letter-spacing: 5px; font-weight: 300;">PROYECTO UPANA</p>
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                ACCEDER CON GOOGLE
            </button>
        </div>
    </div>

    <div id="app">
        <div id="album-view" class="view active">
            <div class="grid-layout">
                <div class="card">
                    <h3 id="grp-name" style="font-family:'Oswald'; color:var(--world-cup-yellow);">GRUPO A</h3>
                    <div id="team-list" style="margin-top:15px;"></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                        <button onclick="changeGroup(-1)" class="buy-btn" style="background:rgba(255,255,255,0.1); color:white;">◄</button>
                        <button onclick="changeGroup(1)" class="buy-btn">►</button>
                    </div>
                </div>
                <div class="card">
                    <h2 id="current-team-title" style="font-family:'Oswald'; border-bottom: 2px solid var(--world-cup-yellow);">SELECCIONA PAÍS</h2>
                    <div class="sticker-grid" id="sticker-grid"></div>
                </div>
            </div>
        </div>

        <div id="special-card-view" class="view" style="max-width: 600px;">
            <div class="card">
                <h2 style="font-family:'Oswald'; color:var(--world-cup-yellow);">SOLICITAR JUGADOR</h2>
                <div class="special-form">
                    <input type="text" id="playerName" placeholder="Nombre del Jugador">
                    <input type="text" id="playerTeam" placeholder="Selección">
                    <p style="font-size:0.8rem; margin-top:15px; opacity:0.7;">Esta solicitud será enviada a tu Asesor para cotización.</p>
                    <button class="buy-btn" onclick="sendOrder('Carta Especial')">ENVIAR A ASESOR</button>
                </div>
            </div>
        </div>

        <div id="shop-view" class="view" style="text-align: center;">
            <div class="card" style="max-width:400px; margin:0 auto; background:white; color:black;">
                <h2 style="font-family:'Oswald';">ÁLBUM FÍSICO</h2>
                <div style="font-size:3rem; font-weight:900; margin:20px 0; color:var(--world-cup-purple);">Q 125.00</div>
                <button class="buy-btn" style="background:var(--world-cup-purple); color:white;" onclick="sendOrder('Álbum Pasta Dura')">COMPRAR AHORA</button>
            </div>
        </div>
    </div>

<script>
    // Tu Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyCUdS0Gzfks0hQJCqTevtz5O2MFlRiHga4",
        authDomain: "tiendaskin-bccba.firebaseapp.com",
        projectId: "tiendaskin-bccba",
        storageBucket: "tiendaskin-bccba.firebasestorage.app",
        messagingSenderId: "280193902268",
        appId: "1:280193902268:web:743d0e2172641be7a292b9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Lógica para enviar pedidos a la página de Asesor
    async function sendOrder(tipo) {
        const user = auth.currentUser;
        const jugador = document.getElementById('playerName').value || "N/A";
        const equipo = document.getElementById('playerTeam').value || "N/A";
        
        const trackingID = "PN-" + Math.floor(1000 + Math.random() * 9000);

        try {
            await db.collection("pedidos").add({
                name: `${user.displayName} - ${tipo}`,
                trackingID: trackingID,
                status: "pendiente",
                details: `Jugador: ${jugador}, Selección: ${equipo}`,
                email: user.email,
                date: new Date().toLocaleString()
            });
            
            msg(`¡Solicitud ${trackingID} enviada! Revisa tu WhatsApp.`);
            
            // También abre WhatsApp por comodidad
            setTimeout(() => {
                window.open(`https://wa.me/50246199644?text=Hola,%20hice%20un%20pedido%20(${trackingID})%20de:%20${tipo}%20${jugador}`);
            }, 1500);

        } catch (e) {
            msg("Error al conectar con asesor.");
        }
    }

    // Funciones de Interfaz
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); }
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(window.innerWidth < 900) toggleMenu();
    }

    function handleLogout() {
        auth.signOut().then(() => {
            document.getElementById('menuBtn').style.display = 'none';
            document.getElementById('contactGroup').style.display = 'none';
            document.getElementById('sidebar').classList.remove('active');
        });
    }

    function msg(t) {
        const c = document.getElementById('toast-container');
        const d = document.createElement('div');
        d.className = 'toast'; d.innerText = t;
        c.appendChild(d); setTimeout(() => d.remove(), 4000);
    }

    // Monitoreo de Sesión
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('menuBtn').style.display = 'block';
            document.getElementById('contactGroup').style.display = 'flex';
            db.collection("usuarios").doc(user.uid).onSnapshot(doc => {
                if(doc.exists) {
                    myStickers = doc.data().coleccion || [];
                    if(activeTeam) renderStickers();
                }
            });
            renderGroup();
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
            document.getElementById('menuBtn').style.display = 'none';
            document.getElementById('contactGroup').style.display = 'none';
        }
    });

    function loginWithGoogle() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    // Datos Álbum y Renderizado
    const grupos = [
        {id: "A", paises: ["México", "Sudáfrica", "Corea del Sur", "República Checa"]},
        {id: "B", paises: ["Canadá", "Bosnia y Herzegovina", "Qatar", "Suiza"]},
        {id: "C", paises: ["Brasil", "Marruecos", "Haití", "Escocia"]},
        {id: "D", paises: ["Estados Unidos", "Paraguay", "Australia", "Turquía"]}
    ];

    let currentIdx = 0; let activeTeam = ""; let myStickers = [];

    function renderGroup() {
        const g = grupos[currentIdx];
        document.getElementById('grp-name').innerText = "GRUPO " + g.id;
        const list = document.getElementById('team-list'); list.innerHTML = "";
        g.paises.forEach(p => {
            const d = document.createElement('div');
            d.style.cssText = "padding:12px; cursor:pointer; border-bottom:1px solid rgba(255,255,255,0.05); font-family:'Oswald';";
            d.onclick = () => { activeTeam = p; document.getElementById('current-team-title').innerText = p.toUpperCase(); renderStickers(); };
            d.innerHTML = `<img src="https://flagcdn.com/w40/${getIso(p)}.png" width="20" style="margin-right:10px"> ${p.toUpperCase()}`;
            list.appendChild(d);
        });
    }

    function renderStickers() {
        const grid = document.getElementById('sticker-grid'); grid.innerHTML = "";
        for(let i=1; i<=20; i++) {
            const id = `${activeTeam}-${i}`;
            const owned = myStickers.includes(id);
            const s = document.createElement('div');
            s.className = `sticker ${owned ? 'owned' : ''}`;
            s.innerText = i;
            s.onclick = () => {
                const newCol = owned ? myStickers.filter(x => x !== id) : [...myStickers, id];
                db.collection("usuarios").doc(auth.currentUser.uid).set({ coleccion: newCol }, {merge: true});
            };
            grid.appendChild(s);
        }
    }

    function changeGroup(n) { currentIdx = (currentIdx + n + grupos.length) % grupos.length; renderGroup(); }
    function getIso(p) {
        const codes = {"México":"mx", "Sudáfrica":"za", "Corea del Sur":"kr", "República Checa":"cz", "Canadá":"ca", "Bosnia y Herzegovina":"ba", "Qatar":"qa", "Suiza":"ch", "Brasil":"br", "Marruecos":"ma", "Haití":"ht", "Escocia":"gb-sct", "Estados Unidos":"us", "Paraguay":"py", "Australia":"au", "Turquía":"tr"};
        return codes[p] || "un";
    }
</script>
</body>
</html>
